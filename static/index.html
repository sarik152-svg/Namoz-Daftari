<style>
:root{
  --night:#0D1220; --panel:#151D2E; --panel2:#1B2436; --line:#26314A;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--sans);
     padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:22px 16px 100px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
button{font:inherit}
.eyebrow{color:var(--brass);font-size:10px;letter-spacing:.22em;text-transform:uppercase}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.p14{padding:14px}.p18{padding:18px}
.mb10{margin-bottom:10px}.mb14{margin-bottom:14px}.mb18{margin-bottom:18px}.mt12{margin-top:12px}.mt14{margin-top:14px}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}
.gap2{gap:8px}.gap3{gap:12px}.col{flex-direction:column}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;
     padding:7px 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px}
.btn:active{opacity:.7}
.btn-gold{background:var(--brass);color:#0D1220;border:none;font-weight:600}
.btn-green{background:var(--jade);color:#08140F;border:none;font-weight:600}
.btn-wide{width:100%;padding:13px 0;border-radius:12px;font-size:14px}
.mbtn{width:42px;height:42px;border-radius:11px;cursor:pointer;background:var(--panel2);
      border:1px solid var(--line);color:var(--mut);display:flex;align-items:center;justify-content:center;font-size:20px}
.input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
      border-radius:9px;padding:10px 11px;font-family:var(--sans);font-size:13px;outline:none}
textarea{line-height:1.6;resize:vertical}
.label{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin:16px 0 7px}
.row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.row span:first-child{color:var(--mut)}
.stat{padding:12px;text-align:center}
.stat b{font-family:var(--serif);font-size:25px;font-weight:400;display:block;line-height:1}
.stat i{font-style:normal;font-size:10px;color:var(--mut);display:block;margin-top:5px}
.bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;display:flex}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(13,18,32,.95);border-top:1px solid var(--line);
        backdrop-filter:blur(8px);padding-bottom:env(safe-area-inset-bottom)}
.tabbar div{max-width:560px;margin:0 auto;display:flex}
.tabbar button{flex:1;padding:11px 0 14px;background:none;border:none;cursor:pointer;color:var(--mut);
        display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;letter-spacing:.05em}
.tabbar button.on{color:var(--brass)}
.ayat{display:flex;gap:8px;padding:10px 12px;background:var(--panel);border-left:2px solid var(--brass);
      border-radius:0 10px 10px 0;font-family:var(--serif);font-size:13.5px;color:var(--mut);line-height:1.55;font-style:italic}
.pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--mut)}.small{font-size:11px}.tiny{font-size:10.5px}
.jade{color:var(--jade)}.clay{color:var(--clay)}.brass{color:var(--brass)}
.arc{position:relative;height:6px;border-radius:3px;background:var(--panel2);
     background-image:linear-gradient(90deg,#4CAF8B55,#4CAF8B33 55%,#C9A22744)}
.arc i{position:absolute;top:-3px;width:6px;height:12px;border-radius:2px;background:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.pname{font-family:var(--serif);font-size:17px}
.chip{font-size:9px;border:1px solid #C9A22755;color:var(--brass);border-radius:4px;padding:1px 5px}
.hd{width:6px;border-radius:3px}
.sw{width:22px;height:22px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;padding:0}
.sw.on{background:var(--brass);border-color:var(--brass)}
.link{background:none;border:none;color:var(--brass);font-size:12px;cursor:pointer;padding:8px 0}
</style>

/* ══════════════ NAMOZ VAQTI ══════════════ */
const D2R=Math.PI/180;
const sinD=d=>Math.sin(d*D2R),cosD=d=>Math.cos(d*D2R),tanD=d=>Math.tan(d*D2R);
const asinD=x=>Math.asin(x)/D2R,acosD=x=>Math.acos(x)/D2R;
const atan2D=(y,x)=>Math.atan2(y,x)/D2R,acotD=x=>Math.atan(1/x)/D2R;
const fixn=(a,b)=>{a-=b*Math.floor(a/b);return a<0?a+b:a};
const fixAng=a=>fixn(a,360),fixHr=a=>fixn(a,24);
function julian(y,m,d){if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
 return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){const D=jd-2451545,g=fixAng(357.529+.98560028*D),q=fixAng(280.459+.98564736*D);
 const L=fixAng(q+1.915*sinD(g)+.02*sinD(2*g)),e=23.439-.00000036*D;
 const RA=fixHr(atan2D(cosD(e)*sinD(L),cosD(L))/15);
 return{decl:asinD(sinD(e)*sinD(L)),eqt:q/15-RA}}
function calcTimes(date,c){
 const jd=julian(date.getFullYear(),date.getMonth()+1,date.getDate())-c.lng/(15*24);
 const midDay=t=>fixHr(12-sunPos(jd+t).eqt);
 const at=(ang,t,ccw)=>{const dc=sunPos(jd+t).decl;
   let x=(-sinD(ang)-sinD(dc)*sinD(c.lat))/(cosD(dc)*cosD(c.lat));x=Math.max(-1,Math.min(1,x));
   return midDay(t)+(ccw?-1:1)*(acosD(x)/15)};
 const asrT=(f,t)=>{const dc=sunPos(jd+t).decl;return at(-acotD(f+tanD(Math.abs(c.lat-dc))),t,false)};
 let t={fajr:5/24,sunrise:6/24,dhuhr:.5,asr:13/24,maghrib:.75,isha:19/24};
 for(let i=0;i<3;i++){t={fajr:at(c.fa,t.fajr,true)/24,sunrise:at(.833,t.sunrise,true)/24,
   dhuhr:(midDay(t.dhuhr)+1/60)/24,asr:asrT(c.asr,t.asr)/24,
   maghrib:at(.833,t.maghrib,false)/24,isha:at(c.ia,t.isha,false)/24}}
 const off=c.tz-c.lng/15,o={};for(const k in t)o[k]=fixHr(t[k]*24+off);return o}
function daySchedule(date,c){
 const T=calcTimes(date,c);
 const pv=new Date(date);pv.setDate(pv.getDate()-1);
 const nx=new Date(date);nx.setDate(nx.getDate()+1);
 const P=calcTimes(pv,c),N=calcTimes(nx,c),nl=24-P.maghrib+T.fajr;
 /* Xufton oynasi yarim tundan o'tib, ERTANGI bomdodda yopiladi. Ilgari bu yerda
    shu kunning bomdodi turardi — u xufton boshlanishidan oldin bo'lgani uchun
    oyna teskari hisoblanib, xufton keyingi kunga surilib ketardi. */
 return{tahajjud:fixHr(P.maghrib+2/3*nl),bomdod:T.fajr,peshin:T.dhuhr,asr:T.asr,shom:T.maghrib,xufton:T.isha,
  endTahajjud:T.fajr,endBomdod:T.sunrise,endPeshin:T.asr,endAsr:T.maghrib,endShom:T.isha,endXufton:N.fajr}}
const hm=d=>{if(d==null||isNaN(d))return"--:--";const m=fixn(Math.round(d*60),1440);
 return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const toMin=s=>{const p=String(s).split(":");return +p[0]*60+ +p[1]};
const diffMin=(a,b)=>{let d=toMin(b)-toMin(a);if(d<-720)d+=1440;if(d>720)d-=1440;return d};
const winLen=(s,e)=>{let d=toMin(e)-toMin(s);if(d<=0)d+=1440;return d};
const inWin=(n,s,e)=>e>s?(n>=s&&n<e):(n>=s||n<e);

/* ══════════════ QAYSI KUN, QAYSI VAQT ══════════════ */
/* Baho har doim a'zoning SHAHRI vaqtida chiqariladi. Telefon boshqa mintaqada
   bo'lsa (masalan Dubay profili bilan Toshkentda yurish) qurilma soati namoz
   jadvaliga to'g'ri kelmaydi va vaqtida o'qilgan namoz qazo bo'lib ko'rinadi. */
function nowFor(c){
 const d=new Date();
 return new Date(d.getTime()+d.getTimezoneOffset()*60000+((c&&c.tz!=null?c.tz:0)*3600000))}
const todayFor=c=>today(nowFor(c));
const decOf=d=>d.getHours()+d.getMinutes()/60;
const PR=k=>{const p=PRAYERS.find(x=>x.k===k);return p?p.n:k};

/* Namoz qaysi kunning daftariga tushishi kerak.
   Xufton yagona yarim tunni kesib o'tadigan vaqt: soat 00:00 dan bomdodgacha
   o'qilgan xufton — KECHAGI kunning xuftoni. Shu shart bo'lmasa u ertangi kunga
   yozilib, kechagi kun esa o'qilmagan bo'lib qolar edi. */
function liveDay(pk,c){
 const n=nowFor(c),ds=today(n);
 if(pk!=="xufton")return ds;
 return decOf(n)<daySchedule(new Date(ds+"T12:00:00"),c).bomdod?shift(ds,-1):ds}

/* Oyna holati: "open" — vaqti kirgan, "early" — hali kirmagan, "past" — o'tib ketgan. */
function winState(pk,ds,c){
 const sc=daySchedule(new Date(ds+"T12:00:00"),c),n=decOf(nowFor(c));
 if(inWin(n,sc[pk],sc[EKY[pk]]))return "open";
 return n<sc[pk]?"early":"past"}

 if(token)h["Authorization"]="Bearer "+token;return h};
async function api(path,opts){
 const r=await fetch(API+path,Object.assign({cache:"no-store",headers:hdrs()},opts||{}));
 if(r.status===401&&token){forgetSession();
   const e=new Error("Sessiya tugadi");e.status=401;throw e}
 if(!r.ok){let msg="";try{const j=await r.json();msg=(j.error&&j.error.message)||""}catch(e){}
  const err=new Error(msg||("HTTP "+r.status));err.status=r.status;throw err}
 return r.status===204?null:r.json()}

 screen="login"}

/* Marks made while offline wait here. pull() replaces local data with the
   server's copy, so anything not yet sent must be flushed first or it is lost. */
let outbox=LS.get("nd_outbox",[]);
const setOutbox=v=>{outbox=v;LS.set("nd_outbox",outbox)};
const rememberFailure=(id,d)=>{
 if(!outbox.some(o=>o.id===id&&o.d===d))setOutbox(outbox.concat([{id:id,d:d}]))};
const clearFailure=(id,d)=>setOutbox(outbox.filter(o=>!(o.id===id&&o.d===d)));
const PERMANENT=[401,403,404,422];
async function flushOutbox(){
 for(const o of outbox.slice()){
  try{await sendDay(o.id,o.d);clearFailure(o.id,o.d)}
  catch(e){
    if(PERMANENT.indexOf(e.status)>=0){clearFailure(o.id,o.d);continue}
    return false}}
 return true}

async function pull(){
 if(!loggedIn())return false;
 if(!await flushOutbox()){
   online=false;syncMsg="saqlanmagan belgilar bor - qayta urinilmoqda";return false}
 try{
   const j=await api(circleId?"/state?circle="+encodeURIComponent(circleId):"/state");
   members=j.members;data={};
   members.forEach(m=>{data[m.id]=Object.assign(blank(),j.data[m.id]||{})});
   LS.set("nd_members",members);LS.set("nd_data",data);
   online=true;syncMsg="";return true;
 }catch(e){online=false;syncMsg=e.status===401?"":"ulanmadi";return false}
}
async function pushMembers(){LS.set("nd_members",members)}
async function pushData(id){
 LS.set("nd_data",data);
 if(!loggedIn())return;
 try{
   await api("/members/"+encodeURIComponent(id)+"/data",
     {method:"PUT",body:JSON.stringify(data[id])});
   online=true;syncMsg="";
 }catch(e){online=false;
   syncMsg=e.status===403?"Bu sizning yozuvingiz emas":e.status===429?"Juda ko'p urinish"
     :"saqlanmadi - oflayn"}
}
async function sendDay(id,d){
 const day=((data[id]||{}).days||{})[d]||{};
 await api("/members/"+encodeURIComponent(id)+"/days/"+encodeURIComponent(d),
   {method:"PUT",body:JSON.stringify(day)})}
async function pushDay(id,d){
 LS.set("nd_data",data);
 if(!loggedIn())return;
 try{
   await sendDay(id,d);clearFailure(id,d);online=true;syncMsg="";
 }catch(e){online=false;
   if(PERMANENT.indexOf(e.status)<0)rememberFailure(id,d);
   syncMsg=e.status===403?"Bu sizning yozuvingiz emas":e.status===429?"Juda ko'p urinish"
     :"saqlanmadi - keyin yuboriladi"}
}

/* A'zolar safarga chiqadi, namoz vaqti esa ular TURGAN shahar bo'yicha bo'lishi
   kerak. Shuning uchun shahar profilda almashtirilmaydi, sanali ro'yxatga
   yoziladi: «shu kundan boshlab — mana bu shaharda». Shunda boshqa shaharga
   ko'chish o'tgan kunlarning vaqtlarini qayta yozib yubormaydi. */
const placesOf=m=>((data[m.id]&&data[m.id].places)||[]);
function cfgAt(m,ds){
 let best=null;
 placesOf(m).forEach(p=>{if(p.d<=ds&&(!best||p.d>=best.d))best=p});
 return best?Object.assign({},m,best):m}
function cfgNow(m){
 let best=null;
 placesOf(m).forEach(p=>{if(!best||p.d>=best.d)best=p});
 return best?Object.assign({},m,best):m}
const myCfg=()=>cfgNow(M(me));

function score(u,c){
 const days=(u&&u.days)||{},ds=Object.keys(days).sort();
 const o={penalty:0,ontime:0,qazo:0,bad:0,tahajjud:0,jamoat:0,quran:0,per:{},bonusSum:0,debt:0,tasks:((u&&u.tasks)||[]).length};
 PRAYERS.forEach(p=>o.per[p.k]={ontime:0,qazo:0,bad:0,delaySum:0,delayN:0});
 ((u&&u.bonuses)||[]).forEach(b=>o.bonusSum+=b.amt);
 /* Kechagi xufton bomdodgacha hali ochiq turadi, shuning uchun kun yopilgan
    bo'lsa ham uni «o'qilmagan» deb jarima yozib bo'lmaydi. */
 const openX=c?liveDay("xufton",c):null;
 if(ds.length){const td=c?todayFor(c):today();let d=ds[0];
  for(let i=0;i<800&&d<=td;i++,d=shift(d,1)){
   const day=days[d]||{},closed=d<td;
   PRAYERS.forEach(p=>{const r=day[p.k],shut=closed&&!(p.k==="xufton"&&d===openX);
    if(!p.fard){if(r&&r.s==="ontime"){o.tahajjud++;o.per[p.k].ontime++}return}
    if(!r){if(shut){o.penalty+=P_MISS;o.bad++;o.per[p.k].bad++}return}
    if(r.s==="ontime"){o.ontime++;o.per[p.k].ontime++;if(r.j)o.jamoat++}
    else if(r.s==="qazo"){o.penalty+=P_QAZO;o.qazo++;o.per[p.k].qazo++}
    else{o.penalty+=P_MISS;o.bad++;o.per[p.k].bad++}});
   if(day.quran)o.quran++}}
 /* Tahajjud nafl — jarima yozmaydi, aksincha har biri qarzni kamaytiradi. */
 o.debt=o.penalty-o.bonusSum-o.tasks*TASK_AT-o.tahajjud*NAFL_BALL-o.jamoat*JAMOAT_BALL;
 return o}
function streakOf(days,pk,c){let cur=c?todayFor(c):today(),n=0;
 if(!(days[cur]&&days[cur][pk]&&days[cur][pk].s==="ontime"))cur=shift(cur,-1);
 for(let i=0;i<400;i++){if(days[cur]&&days[cur][pk]&&days[cur][pk].s==="ontime"){n++;cur=shift(cur,-1)}else break}
 return n}
const claimed=(u,pk)=>((u&&u.bonuses)||[]).filter(b=>b.p===pk).reduce((m,b)=>Math.max(m,b.lvl),0);

/* ══════════════ KITOB HISOBI ══════════════ */
const bookRead=b=>(b.log||[]).reduce((s,e)=>s+e.p,0);
const bookOpenOn=(b,ds)=>b.started<=ds&&(!b.finished||b.finished>=ds);
const dayPages=(u,ds)=>((u&&u.books)||[]).reduce((s,b)=>{
 const e=(b.log||[]).find(x=>x.d===ds);return s+(e?e.p:0)},0);
const daysBetween=(a,z)=>Math.round((new Date(z+"T12:00:00")-new Date(a+"T12:00:00"))/86400000);

/* O'qish tezligi kitob boshlangandan beri o'tgan HAR BIR kunga bo'linadi, faqat
   o'qilgan kunlarga emas — «kuniga nechi bet» degani shu, va tashlab qo'yilgan
   kunlar tugash muddatini uzaytirib ko'rsatadi. */
function bookPace(b,td){
 const read=bookRead(b),qoldi=Math.max(0,b.pages-read);
 const kun=Math.max(1,daysBetween(b.started,b.finished||td)+1);
 const tezlik=read/kun;
 const kunQoldi=qoldi<=0?0:(tezlik>0?Math.ceil(qoldi/tezlik):null);
 return{read,qoldi,kun,tezlik,kunQoldi,foiz:Math.min(100,Math.round(read/b.pages*100)),
  tugash:kunQoldi?shift(td,kunQoldi):null}}

/* Ochiq kitobi bor har bir YOPILGAN kun baholanadi: norma bajarilsa 0,
   kam o'qilsa −0,5, umuman o'qilmasa −1. Zametka +0,5, tugatilgan kitob +5. */
function bookScore(u,c){
 const bs=(u&&u.books)||[];
 const o={penalty:0,bonus:0,debt:0,kun:0,toliq:0,kam:0,nol:0,bet:0,notes:0,done:0,streak:0,ochiq:0};
 bs.forEach(b=>{o.bet+=bookRead(b);o.notes+=(b.notes||[]).length;
  if(b.finished)o.done++;else o.ochiq++});
 o.bonus=o.notes*K_NOTE+o.done*K_DONE;
 if(!bs.length)return o;
 const td=c?todayFor(c):today();
 let d=bs.map(b=>b.started).sort()[0];
 for(let i=0;i<800&&d<td;i++,d=shift(d,1)){
  if(!bs.some(b=>bookOpenOn(b,d)))continue;
  o.kun++;const bet=dayPages(u,d);
  if(bet>=BET_NORMA)o.toliq++;
  else if(bet>0){o.kam++;o.penalty+=K_KAM}
  else{o.nol++;o.penalty+=K_NOL}}
 o.debt=o.penalty-o.bonus;
 o.streak=bookStreak(u,c);
 return o}

function bookStreak(u,c){
 let cur=c?todayFor(c):today(),n=0;
 if(dayPages(u,cur)<BET_NORMA)cur=shift(cur,-1);
 for(let i=0;i<400;i++){if(dayPages(u,cur)>=BET_NORMA){n++;cur=shift(cur,-1)}else break}
 return n}

/* ══════════════ HAFTA VA OY QAHRAMONI ══════════════ */
/* Hafta dushanbadan yakshanbagacha. Natija yakshanba kuni xufton vaqti
   kirgandan keyin — ya'ni haftaning oxirgi namoz vaqtidan keyin — yakuniy
   bo'ladi; undan oldin «hozircha» deb ko'rsatiladi. */
function weekRange(ds){
 const dow=(new Date(ds+"T12:00:00").getDay()+6)%7;
 return[shift(ds,-dow),shift(ds,6-dow)]}
function monthRange(ds){
 const d=new Date(ds+"T12:00:00"),y=d.getFullYear(),m=d.getMonth();
 const pad=n=>String(n).padStart(2,"0");
 return[y+"-"+pad(m+1)+"-01",y+"-"+pad(m+1)+"-"+pad(new Date(y,m+1,0).getDate())];}
function periodDone(z,c){
 const td=todayFor(c);
 if(td>z)return true;
 if(td<z)return false;
 return winState("xufton",z,c)!=="early"}

/* Oraliqdagi namoz bali: vaqtida +1, qazo −0,25, o'qilmagan −1.
   Tahajjud nafl — faqat qo'shadi, hech qachon kamaytirmaydi. */
function prayerRange(u,m,a,z){
 const c=cfgNow(m),days=(u&&u.days)||{},td=todayFor(c),openX=liveDay("xufton",c);
 /* Hisob a'zo daftar tuta boshlagan kundan boshlanadi — score() dagidek. Aks holda
    guruhga keyin qo'shilgan odam o'zi yo'q kunlar uchun jarima olib qolardi. */
 const boshi=Object.keys(days).sort()[0];
 const o={ontime:0,qazo:0,bad:0,tahajjud:0,jamoat:0,ball:0};
 if(!boshi)return o;
 for(let d=a<boshi?boshi:a,i=0;i<40&&d<=z;i++,d=shift(d,1)){
  if(d>td)break;
  const day=days[d]||{},closed=d<td;
  PRAYERS.forEach(p=>{const r=day[p.k],shut=closed&&!(p.k==="xufton"&&d===openX);
   if(!p.fard){if(r&&r.s==="ontime"){o.tahajjud++;o.ball+=NAFL_BALL}return}
   if(!r){if(shut){o.bad++;o.ball-=P_MISS}return}
   if(r.s==="ontime"){o.ontime++;o.ball+=1;if(r.j){o.jamoat++;o.ball+=JAMOAT_BALL}}
   else if(r.s==="qazo"){o.qazo++;o.ball-=P_QAZO}
   else{o.bad++;o.ball-=P_MISS}})}
 return o}

/* Kitob bali: har normalik bet 1 ball, zametka +0,5, tugatilgan kitob +5. */
function bookRange(u,a,z){
 const o={bet:0,notes:0,done:0,ball:0};
 ((u&&u.books)||[]).forEach(b=>{
  (b.log||[]).forEach(e=>{if(e.d>=a&&e.d<=z)o.bet+=e.p});
  (b.notes||[]).forEach(n=>{if(n.d>=a&&n.d<=z)o.notes++});
  if(b.finished&&b.finished>=a&&b.finished<=z)o.done++});
 o.ball=o.bet/BET_NORMA+o.notes*K_NOTE+o.done*K_DONE;
 return o}

function rankBy(a,z,kind){
 return members.map(m=>{
  const u=data[m.id]||blank();
  const o=kind==="namoz"?prayerRange(u,m,a,z):bookRange(u,a,z);
  return{m:m,o:o,ball:o.ball}}).sort((x,y)=>y.ball-x.ball)}

/* Olimpiada uslubidagi kursi: 2-o'rin chapda, 1-o'rin o'rtada va balandroq,
   3-o'rin o'ngda. Faqat NAMOZ bo'yicha — kitob reytingi Kitob bo'limida turadi. */
function podium(nom,a,z,done){
 const r=rankBy(a,z,"namoz"),top=r.slice(0,3),rest=r.slice(3);
 const H=[96,72,58],C=["#C9A227","#98A3B8","#C0864F"],MED=["\u{1F947}","\u{1F948}","\u{1F949}"];

  <div class="flex between center" style="margin-bottom:14px">
   <div><div class="eyebrow">${nom}</div>
    <div class="muted small" style="margin-top:3px">${pretty(a)} — ${pretty(z)}</div></div>
   <span class="chip" style="color:${done?"var(--jade)":"var(--brass)"}">${done?"YAKUNIY":"HOZIRCHA"}</span>
  </div>
  <div style="display:flex;align-items:flex-end;justify-content:center;gap:7px">`;
 [1,0,2].forEach(i=>{
  const x=top[i];if(!x)return;

/* Har bir a'zo uchun bir marta hisoblanadigan yig'ma ko'rsatkichlar. Nishonlar
   shu yerdan o'qiladi — alohida saqlanmaydi, chunki hammasi mavjud yozuvlardan
   kelib chiqadi va keyin qoida o'zgarsa o'zi qayta hisoblanadi. */
function perfectStreak(days,c){
 const toliq=d=>{const day=days[d];
  return!!day&&PRAYERS.filter(p=>p.fard&&day[p.k]&&day[p.k].s==="ontime").length===5};
 let cur=todayFor(c),n=0;
 if(!toliq(cur))cur=shift(cur,-1);
 for(let i=0;i<400;i++){if(toliq(cur)){n++;cur=shift(cur,-1)}else break}
 return n}

function nishonStat(m){
 const u=data[m.id]||blank(),c=cfgNow(m),days=u.days||{};
 const s=score(u,c),k=bookScore(u,c);
 let mukammalKun=0,quranKun=0,jumaMukammal=0;
 Object.keys(days).forEach(d=>{
  const day=days[d];
  const v=PRAYERS.filter(p=>p.fard&&day[p.k]&&day[p.k].s==="ontime").length;
  if(v===5){mukammalKun++;if(new Date(d+"T12:00:00").getDay()===5)jumaMukammal++}
  if(day.quran)quranKun++});
 return{s:s,k:k,mukammalKun:mukammalKun,quranKun:quranKun,jumaMukammal:jumaMukammal,
  bomdodStreak:streakOf(days,"bomdod",c),mukammalStreak:perfectStreak(days,c)}}

/* Hamma bir kishi uchun, bir kishi hamma uchun: nishon HAMMA a'zo o'z
   maqsadiga yetgandagina olinadi. Bittasi yetmasa — hech kim olmaydi. */
const HAFTA_MAQSAD=25;
function jamoaHafta(a,z){
 const rows=members.map(m=>{
  const o=prayerRange(data[m.id]||blank(),m,a,z);
  return{m:m,ontime:o.ontime,jamoat:o.jamoat,ok:o.ontime>=HAFTA_MAQSAD}});
 return{rows:rows,ok:rows.length>0&&rows.every(x=>x.ok)}}
function jamoaTarix(c){
 let eng=null;
 members.forEach(m=>{const ks=Object.keys((data[m.id]||{}).days||{}).sort();
  if(ks.length&&(!eng||ks[0]<eng))eng=ks[0]});
 if(!eng)return 0;
 let n=0,w=weekRange(todayFor(c));
 for(let i=0;i<200;i++){
  w=weekRange(shift(w[0],-1));
  if(w[1]<eng)break;
  if(jamoaHafta(w[0],w[1]).ok)n++}
 return n}

/* Jamoaning barcha zametkalari, eng yangisi tepada. */
function allNotes(){
 const out=[];
 members.forEach(m=>((data[m.id]&&data[m.id].books)||[]).forEach(b=>
  (b.notes||[]).forEach(n=>out.push({m,b,n}))));
 return out.sort((x,y)=>{
  const a=x.n.d+" "+(x.n.t||"00:00"),z=y.n.d+" "+(y.n.t||"00:00");
  return a<z?1:a>z?-1:0})}

 async mark(pk,how,ds){
  const cfg=myCfg(),P=PRAYERS.find(x=>x.k===pk)||{},live=liveDay(pk,cfg);
  /* Xufton bomdodgacha kechagi kunga yoziladi, shuning uchun yoziladigan kun
     ekranda ochiq turgan kundan farq qilishi mumkin. */
  const tgt=ds||(date===todayFor(cfg)?live:date);
  const day=Object.assign({},(data[me].days||{})[tgt]||{});
  /* Belgi bir marta qo'yiladi va keyin o'zgarmaydi. Serverda ham shu qoida bor;
     bu yerdagi tekshiruv shunchaki bekorga so'rov yubormaslik uchun. */
  if(day[pk])return;
  const n=nowFor(cfg);
  const nowHM=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
  let yangi;
  if(how==="miss")yangi={s:"missed",t:null};
  else if(how==="jamoat"&&!P.fard)return;
  /* Nafl namoz istalgan vaqtda o'qiladi va hech qachon minus bermaydi —
     u faqat qo'shadi, shuning uchun oyna ham, kun yopilgani ham to'smaydi. */
  else if(!P.fard)yangi={s:"ontime",t:tgt===live?nowHM:null};
  else if(tgt!==live)yangi={s:"late",t:null};
  else{
   const st=winState(pk,tgt,cfg);
   /* Farz namozning vaqti kirmagan bo'lsa belgilab bo'lmaydi. */
   if(st==="early")return;
   yangi={s:st==="open"?"ontime":"qazo",t:nowHM}}
  /* «Jamoat bilan» — bu ro'y bergan voqea, shuning uchun qazo bo'lsa ham
     yoziladi; qo'shimcha ball esa faqat vaqtida o'qilganiga beriladi. */
  if(how==="jamoat")yangi.j=true;
  /* Yozuv ortga qaytmagani uchun avval bir marta so'raymiz — noto'g'ri bosilgan
     tugma butun kunni buzib qo'ymasin. */
  const S=STATUS[yangi.s],nomi=!P.fard?"o'qildi":(S?S.label.toLowerCase():yangi.s);
  const qay=yangi.j?", jamoat bilan":"";
  if(!confirm(P.n+" — «"+nomi+qay+"» deb yoziladi"+(yangi.t?", soat "+yangi.t:"")
    +(tgt!==date?" ("+pretty(tgt)+")":"")
    +".\n\nBir marta belgilangandan keyin o'zgartirib bo'lmaydi."))return;
  day[pk]=yangi;
  data[me]=Object.assign({},data[me],{days:Object.assign({},data[me].days,{[tgt]:day})});

   lng=parseFloat(document.getElementById("f_lng").value);
   if(!city||isNaN(lat)||isNaN(lng)){err.textContent="Shahar va koordinatalarni to'ldiring";return}
   if(Math.abs(lat)>66){err.textContent="Kenglik ±66 dan oshmasin";return}
  }else{const c=CITIES[+document.getElementById("f_sel").value];city=c.n;lat=c.lat;lng=c.lng;fa=c.fa;ia=c.ia}
  const tz=parseFloat(document.getElementById("f_tz").value);
  const asr=+document.querySelector("[name=f_asr]:checked").value;
  const pin=document.getElementById("f_pin").value.trim();
  if(!/^[0-9]{4}$/.test(pin)){err.textContent="PIN 4 ta raqam bo'lsin";return}
  let b=name.toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,12)||"user",id=b,i=2;
  const taken=(roster.length?roster:members).map(x=>x.id);
  while(taken.indexOf(id)>=0)id=b+(i++);
  try{await api("/members",{method:"POST",
    body:JSON.stringify({id:id,name:name,city:city,lat:lat,lng:lng,tz:tz,asr:asr,fa:fa,ia:ia,pin:pin})})}
  catch(e){err.textContent=e.message||"Qo'shib bo'lmadi";return}
  await A.loadRoster();screen="admin";render()},
 async delMember(id){
  if(!confirm(id+" va uning barcha yozuvlari o'chirilsinmi?"))return;
  try{await api("/members/"+encodeURIComponent(id),{method:"DELETE"})}
  catch(e){alert(e.message||"O'chirib bo'lmadi");return}
  if(isAdmin){await A.loadRoster()}else{forgetSession()}
  render()},
 exportJSON(){
  const blob=new Blob([JSON.stringify({members:members,data:data},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="namoz-daftari-"+today()+".json";a.click()},
 importJSON(inp){
  const f=inp.files[0];if(!f)return;const fr=new FileReader();
  fr.onload=async()=>{try{const j=JSON.parse(fr.result);
   if(j.members)members=j.members;if(j.data)data=j.data;
   members.forEach(m=>{if(!data[m.id])data[m.id]=blank()});
   await pushMembers();if(me)await pushData(me);
   alert("Yuklandi");render()}catch(e){alert("Fayl noto'g'ri")}};
  fr.readAsText(f)}
};

function todayTab(){
 const cfg=myCfg(),sc=daySchedule(new Date(date+"T12:00:00"),cfgAt(M(me),date));
 const isT=date===todayFor(cfg),now=nowFor(cfg),nowDec=decOf(now);
 const day=(data[me].days||{})[date]||{},s=score(data[me],cfg);
 let dayBall=0;PRAYERS.forEach(p=>{const r=day[p.k];
  if(r&&STATUS[r.s])dayBall+=STATUS[r.s].ball+(r.j&&r.s==="ontime"?JAMOAT_BALL:0)});
 let nx=null;
 if(isT){const list=PRAYERS.map(p=>({p:p,t:sc[p.k]})).sort((a,b)=>a.t-b.t);
  nx=list.find(x=>x.t>nowDec)||null;
  /* Xufton kirgandan keyin kun ichida boshqa vaqt qolmaydi — keyingisi ertangi bomdod. */
  if(!nx)nx={p:PRAYERS.find(p=>p.k==="bomdod"),t:sc.endXufton+24}}
 let h=`<div class="flex between center mb14">
  <button class="btn" onclick="A.setDate(-1)">‹</button>
  <div style="text-align:center">
   <div style="font-family:var(--serif);font-size:19px">${pretty(date)}</div>
   <div class="muted small" style="letter-spacing:.08em">${esc(cfg.city.toUpperCase())} · ${isT?"KUN OCHIQ":"KUN YOPILGAN"}</div>
  </div>
  <button class="btn" ${date>=todayFor(cfg)?'style="opacity:.3"':""} onclick="${date>=todayFor(cfg)?"":"A.setDate(1)"}">›</button>
 </div>
 <div class="grid2 mb14">
  <div class="panel stat"><b class="${dayBall===0?"jade":"clay"}">${dayBall===0?"0":fmt(dayBall)}</b><i>Shu kun bali</i></div>
  <div class="panel stat"><b class="${s.debt>0?"clay":"jade"}">${s.debt>0?"−"+fmt(s.debt):"+"+fmt(-s.debt)}</b><i>${s.debt>0?"Umumiy qarz":"Zaxira ball"}</i></div>
 </div>`;
 if(nx){const mm=Math.round((nx.t-nowDec)*60);
  h+=`<div class="panel p14 mb14 flex between center">
   <div><div class="eyebrow">Keyingi vaqt</div><div style="font-family:var(--serif);font-size:20px;margin-top:2px">${nx.p.n}</div></div>
   <div style="text-align:right"><div class="brass" style="font-family:var(--serif);font-size:26px">${hm(nx.t)}</div>
   <div class="muted small">${Math.floor(mm/60)} soat ${mm%60} daqiqa qoldi</div></div></div>`}
 PRAYERS.forEach(p=>{
  /* Ochiq kunda har bir namoz o'z kuniga bog'lanadi: xufton bomdodgacha
     kechagi kunning xuftoni bo'lib qolaveradi. */
  const tgt=isT?liveDay(p.k,cfg):date;
  const tsc=tgt===date?sc:daySchedule(new Date(tgt+"T12:00:00"),cfgAt(M(me),tgt));
  const st0=hm(tsc[p.k]),en=hm(tsc[EKY[p.k]]);
  const r=((data[me].days||{})[tgt]||{})[p.k],S0=r?STATUS[r.s]:null;
  const state=isT?winState(p.k,tgt,cfg):null;
  /* Nafl uchun oyna faqat tavsiya — belgilash hech qachon to'silmaydi. */
  const open=state==="open",notYet=p.fard&&state==="early",shifted=tgt!==date;
  /* Belgilangan namoz qulflanadi: tahrirlash ham, tozalash ham yo'q. */
  const locked=!!r;
  const crosses=p.k==="xufton";
  const dl=(r&&r.t&&(r.s==="ontime"||r.s==="qazo"))?diffMin(st0,r.t):null;
  /* Qulflangan qatorda tugmalar ko'rinadi-yu, bosilmaydi: tanlangani yorqin,
     tanlanmagani xira turadi. */
  const stCol=!r?"":r.s==="ontime"?"var(--jade)":r.s==="missed"?"var(--clay)":"var(--brass)";
  const onStyle=`background:${stCol};border-color:transparent;color:#0D1220`;
  const offStyle=locked?"opacity:.28;cursor:default":(notYet?"opacity:.35":"");
  const btn=(on,belgi,how,izoh)=>`<button class="mbtn" title="${izoh}" style="${on?onStyle:offStyle}"`
    +`${locked||notYet?"":` onclick="A.mark('${p.k}','${how}','${tgt}')"`}>${belgi}</button>`;
  h+=`<div class="panel p14 mb10" style="border-color:${S0?S0.color:(open?"#C9A22755":"var(--line)")}">
   <div class="flex center gap3">
    <div style="width:34px;height:34px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;
      justify-content:center;color:${open?"var(--brass)":"var(--mut)"};flex-shrink:0">${p.ic}</div>
    <div style="flex:1;min-width:0">
     <div class="flex center gap2"><span class="pname">${p.n}</span>
      ${!p.fard?'<span class="chip">NAFL</span>':""}
      ${open?'<span class="jade" style="font-size:9px">● VAQTI KIRDI</span>':""}</div>
     <div class="muted small">${st0} — ${en}${crosses?" <span class='tiny'>(ertangi bomdodgacha)</span>":""}${
       !p.fard?" <span class='jade tiny'>· istalgan vaqtda</span>":""}</div>
     ${shifted?`<div class="brass tiny" style="margin-top:2px">${pretty(tgt)} kunining xuftoni</div>`:""}
    </div>
    ${p.fard?btn(!!(r&&r.j),"\u{1F54C}","jamoat","Jamoat bilan o'qidim"):""}
    ${btn(!!r&&!(r&&r.j)&&r.s!=="missed","\u2713","pray",p.fard?"Yolg'iz o'qidim":"O'qidim")}
    ${p.fard?btn((r&&r.s)==="missed","\u2212","miss","O'qimadim"):""}
   </div>`;
  if(r){
   if((r.s==="ontime"||r.s==="qazo")&&r.t){
    const tot=winLen(st0,en),raw=diffMin(st0,r.t)/tot,pos=Math.max(0,Math.min(1,raw));
    h+=`<div class="arc" style="margin-top:12px"><i style="left:calc(${pos*100}% - 3px);background:${raw>1?"var(--clay)":"var(--text)"}"></i></div>`}
   h+=`<div class="flex between center" style="margin-top:8px">
     <div style="font-size:12px;color:${!p.fard?"var(--jade)":S0.color}">${
       !p.fard?"O'qildi":S0.label}${r.j?" \u{1F54C} jamoat":""} ·
       <span class="${!p.fard||S0.ball===0||(r.j&&r.s==="ontime")?"jade":"clay"}">${
         !p.fard?"+"+fmt(NAFL_BALL)+" ball"
         :r.j&&r.s==="ontime"?"+"+fmt(JAMOAT_BALL)+" ball"
         :S0.ball===0?"0 ball":fmt(S0.ball)+" ball"}</span>
       ${dl!=null&&dl>=0&&r.s==="ontime"?" · +"+dl+" daq":""}</div>
     <div class="muted tiny">${r.t?esc(r.t)+" · ":""}\u{1F512} qulflangan</div></div>`;
  }else{
   h+=`<div class="muted" style="margin-top:10px;font-size:11.5px">${
    !p.fard?"Nafl — minus yo'q. Istalgan vaqtda o'qiysiz, har biri qarzni "+fmt(NAFL_BALL)+" ballga kamaytiradi"
    :notYet?"Vaqti kirmagan — vaqti kirgach belgilanadi"
    :open?"Vaqti ichida — hozir belgilasangiz 0 ball"
    :isT?"Vaqti o'tdi — bugun qazo qilsangiz −0,25, ertaga qolsa −1"
    :"Belgilanmagan — o'tkazib yuborilgan hisoblanadi (−1)"}</div>`}
  h+=`</div>`});
 h+=`<div class="panel p14 mt14 flex between center">
   <div><div style="font-family:var(--serif);font-size:16px">Bugun Qur'on o'qidim</div>
   <div class="muted small">Oz bo'lsa ham — davomiysi afzal</div></div>
   <button class="mbtn" style="${day.quran?"background:var(--jade);border-color:transparent;color:#0D1220":""}"
     onclick="A.field('quran',${day.quran?"false":"true"})">✓</button></div>`;
 return h}

 ranked.forEach((m,i)=>{

 h+=`</div>`;
 /* strike */
 h+=`<div class="panel p14 mb14" style="border-color:#C9A22744"><div class="eyebrow">Strike — har ${STREAK_STEP} kun mukofot</div>
  <p class="muted small" style="margin:6px 0 12px">Bir namozni ${STREAK_STEP} kun ketma-ket vaqtida o'qisangiz,
   qarzingizning yarmi o'chadi (${BONUS_MIN}–${BONUS_MAX} ball).</p>`;
 PRAYERS.forEach(p=>{
  const st=streakOf(data[me].days||{},p.k,myCfg()),lvl=Math.floor(st/STREAK_STEP),cl=claimed(data[me],p.k);
  const ready=lvl>cl,prog=(st%STREAK_STEP)/STREAK_STEP;
  h+=`<div style="margin-bottom:11px">
   <div class="flex between center" style="font-size:12px;margin-bottom:5px">

     :`<span class="muted small">${cl>0?cl+" mukofot · ":""}${STREAK_STEP-(st%STREAK_STEP)} kun qoldi</span>`}
   </div>
   <div class="bar"><div style="width:${(ready?1:prog)*100}%;background:${ready?"var(--brass)":"var(--jade)"}"></div></div>
  </div>`});
 h+=`</div>`;
 /* 14 kunlik grafik */
 h+=`<div class="panel p14 mb14"><div class="eyebrow">So'nggi 14 kun · vaqtida o'qilgan farzlar</div>${chartSVG()}</div>`;
 return h}

function chartSVG(){
 const W=520,H=150,pad=20,n=14,k=members.length;
 const gw=(W-pad*2)/n,bw=Math.max(3,(gw-4)/Math.max(1,k));
 let bars="",labels="";
 for(let i=0;i<n;i++){
  const ds=shift(todayFor(myCfg()),-(n-1-i)),x0=pad+i*gw;
  members.forEach((m,j)=>{
   const day=(data[m.id]&&data[m.id].days&&data[m.id].days[ds])||{};
   const v=PRAYERS.filter(p=>p.fard&&day[p.k]&&day[p.k].s==="ontime").length;
   const hh=(H-38)*(v/5),x=x0+2+j*bw;
   bars+=`<rect x="${x.toFixed(1)}" y="${(H-24-hh).toFixed(1)}" width="${(bw-1).toFixed(1)}" height="${Math.max(hh,1).toFixed(1)}"
     rx="2" fill="${colorOf(m.id)}" opacity="${v?1:.25}"></rect>`});
  if(i%2===0)labels+=`<text x="${(x0+gw/2).toFixed(1)}" y="${H-8}" fill="#8895AE" font-size="9" text-anchor="middle">${ds.slice(8)}</text>`}
 let grid="";[0,.5,1].forEach(f=>{const y=H-24-(H-38)*f;
  grid+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#26314A" stroke-dasharray="2 4"></line>`});
 const leg=members.map(m=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px">
   <span class="dot" style="background:${colorOf(m.id)}"></span><span class="muted tiny">${esc(first(m.name))}</span></span>`).join("");
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:10px">${grid}${bars}${labels}</svg>
  <div style="margin-top:6px">${leg}</div>`}

 let h=`<div class="eyebrow">Jamoa</div>
 <h2 style="font-size:24px;margin:6px 0 12px">Umumiy kitob daftari</h2>`+bookSwitch();
 h+=`<div class="panel p14 mb14"><div class="eyebrow">Kim nima o'qiyapti</div><div class="mt12">`;
 let bor=false;
 members.forEach(m=>{
  const bs=((data[m.id]&&data[m.id].books)||[]).filter(b=>!b.finished);
  const k=bookScore(data[m.id],cfgNow(m));
  h+=`<div style="padding:9px 0;border-bottom:1px solid var(--line)">
   <div class="flex between center" style="margin-bottom:5px">
    <span style="font-size:12.5px;color:${colorOf(m.id)}">${esc(first(m.name))}</span>
    <span class="muted tiny">${k.bet} bet · ${k.notes} zametka · ${k.done} tugatgan ·
     <span class="${k.debt>0?"clay":"jade"}">${k.debt>0?"−"+fmt(k.debt):"+"+fmt(-k.debt)}</span></span></div>`;
  if(bs.length){bor=true;bs.forEach(b=>{const pc=bookPace(b,td);
   h+=`<div style="margin-bottom:6px">
    <div class="flex between tiny" style="margin-bottom:3px">
     <span>${esc(b.title)}${b.author?" <span class='muted'>· "+esc(b.author)+"</span>":""}</span>
     <span class="muted">${pc.read}/${b.pages}${pc.kunQoldi?" · "+pc.kunQoldi+" kun":""}</span></div>
    <div class="bar"><div style="width:${pc.foiz}%;background:${colorOf(m.id)}"></div></div></div>`})}
  else h+=`<div class="muted tiny">Hozir ochiq kitobi yo'q.</div>`;
  h+=`</div>`});
 h+=`</div></div>`;
 /* Kitob reytingi shu yerda turadi — Statistika faqat namoz bo'yicha. */
 const wk=weekRange(td),kr=rankBy(wk[0],wk[1],"kitob");
 const MED=["\u{1F947}","\u{1F948}","\u{1F949}"];
 h+=`<div class="panel p14 mb14"><div class="eyebrow">Bu hafta ko'p o'qiganlar</div>
  <div class="muted tiny" style="margin:4px 0 10px">${pretty(wk[0])} — ${pretty(wk[1])}</div>`;
 kr.forEach((x,i)=>{
  h+=`<div class="flex between center" style="padding:7px 0;border-top:1px solid var(--line)">
   <span class="flex center gap2" style="min-width:0">
    <span style="width:22px;flex-shrink:0">${MED[i]||(i+1)+"."}</span>
    <span style="font-size:13px;color:${colorOf(x.m.id)}">${esc(first(x.m.name))}</span></span>
   <span class="muted tiny">${x.o.bet} bet · ${x.o.notes} zametka
    <span class="${x.ball>0?"jade":"muted"}" style="font-family:var(--serif);font-size:15px;margin-left:5px">${fmt(x.ball)}</span></span>
  </div>`});
 h+=`</div>`;
 const feed=allNotes();
 h+=`<div class="eyebrow" style="margin-bottom:4px">Zametkalar · eng yangisi tepada</div>
  <p class="muted small" style="margin:0 0 12px">Bir-biringiz o'qiyotgan kitoblardan olgan fikrlar.</p>`;
 h+=feed.length?feed.map(x=>noteBubble(x.m,x.b,x.n,x.m.id===me)).join("")
  :`<div class="panel" style="padding:26px;text-align:center">
    <div style="font-size:26px">\u{1F4AC}</div>
    <div style="font-family:var(--serif);font-size:18px;margin-top:6px">Hali zametka yo'q</div>
    <p class="muted" style="font-size:13px;margin-top:6px">Birinchi bo'lib fikringizni yozing.</p></div>`;
 return h+`<div style="height:20px"></div>`}

/* ────────── NISHONLAR ────────── */
function nishonTab(){
 const cfg=myCfg(),wk=weekRange(todayFor(cfg));
 const jh=jamoaHafta(wk[0],wk[1]),tarix=jamoaTarix(cfg);
 const kim=(A.nishonKim&&M(A.nishonKim))?A.nishonKim:me;
 const t=nishonStat(M(kim));
 const olingan=NISHONLAR.filter(x=>x.v(t)>=x.kerak);
 const qolgan=NISHONLAR.filter(x=>x.v(t)<x.kerak)
   .sort((a,b)=>(b.v(t)/b.kerak)-(a.v(t)/a.kerak));

 let h=`<div class="eyebrow">Jamoa</div>
 <h2 style="font-size:24px;margin:6px 0 12px">Haftalik nishon</h2>
 <div class="panel p18 mb14" style="border-color:${jh.ok?"#4CAF8B66":"#C9A22744"}">
  <div class="flex center gap3">
   <div style="flex:1;min-width:0">
    <div style="font-family:var(--serif);font-size:19px" class="${jh.ok?"jade":""}">${
      jh.ok?"Nishon olindi":"Hammamiz uchun"}</div>
    <p class="muted small" style="margin:5px 0 0;line-height:1.65">Har bir a'zo shu hafta
     ${HAFTA_MAQSAD} ta namozni vaqtida o'qisa, nishonni hammamiz olamiz.
     Bittamiz yetmasa — hech kim olmaydi.</p></div>
   <div style="font-size:36px;${jh.ok?"":"opacity:.22;filter:grayscale(1)"}">\u{1F91D}</div>
  </div>
  <div style="margin-top:14px">`;
 jh.rows.forEach(x=>{
  const pct=Math.min(100,Math.round(x.ontime/HAFTA_MAQSAD*100));
  h+=`<div style="margin-bottom:10px">
   <div class="flex between tiny" style="margin-bottom:4px">
    <span style="color:${colorOf(x.m.id)}">${esc(first(x.m.name))}${x.ok?" \u2713":""}</span>
    <span class="${x.ok?"jade":"muted"}">${x.ontime} / ${HAFTA_MAQSAD}</span></div>
   <div class="bar"><div style="width:${pct}%;background:${x.ok?"var(--jade)":"var(--brass)"}"></div></div>
  </div>`});
 h+=`</div><div class="muted tiny">${pretty(wk[0])} — ${pretty(wk[1])} · jami olingan: ${tarix} hafta</div></div>`;

 h+=`<div class="flex gap2 mb14" style="flex-wrap:wrap">`;
 members.forEach(m=>{
  h+=`<button class="btn" style="${m.id===kim
    ?"background:var(--brass);color:#0D1220;border-color:transparent;font-weight:600":""}"
    onclick="A.setNishonKim('${m.id}')">${esc(first(m.name))}</button>`});
 h+=`</div>`;

 h+=`<div class="flex between center mb10">
   <div class="eyebrow">Olingan nishonlar</div>
   <span class="brass small">${olingan.length} / ${NISHONLAR.length}</span></div>`;
 if(olingan.length){
  h+=`<div class="mb14" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:9px">`;
  olingan.forEach(x=>{
   h+=`<div class="panel" style="padding:12px 7px;text-align:center;border-color:#C9A22755">
    <div style="font-size:25px;line-height:1">${x.ic}</div>
    <div style="font-family:var(--serif);font-size:12px;margin-top:6px;line-height:1.3">${esc(x.n)}</div></div>`});
  h+=`</div>`;
 }else h+=`<div class="panel p14 mb14"><p class="muted small" style="margin:0">
   Hali nishon yo'q. Birinchisi bir marta namozni vaqtida belgilash bilan ochiladi.</p></div>`;

 h+=`<div class="eyebrow" style="margin-bottom:10px">Hali olinmagan</div>`;
 qolgan.forEach(x=>{
  const val=x.v(t),pct=Math.min(100,Math.round(val/x.kerak*100));
  h+=`<div class="panel p14 mb10">
   <div class="flex center gap3">
    <div style="font-size:21px;opacity:.28;filter:grayscale(1);flex-shrink:0">${x.ic}</div>
    <div style="flex:1;min-width:0">
     <div style="font-size:13.5px">${esc(x.n)}</div>
     <div class="muted tiny" style="margin-top:2px">${esc(x.d)}</div></div>
    <div class="muted small" style="flex-shrink:0">${val} / ${x.kerak}</div></div>
   <div class="bar" style="margin-top:9px"><div style="width:${pct}%;background:var(--brass)"></div></div>
  </div>`});
 return h+`<div style="height:16px"></div>`}

/* Doira almashtirgichi. Bitta doira bo'lsa ko'rsatilmaydi — tanlanadigan narsa
   yo'q joyda tugma qatori shovqindan boshqa narsa emas. */
function circleSwitcher(list){
 if(!list||list.length<2)return "";
 const on="background:var(--brass);color:#0D1220;border-color:transparent;font-weight:600";
 return `<div class="flex gap2 mb14" style="flex-wrap:wrap">`+list.map(c=>
   `<button class="btn" style="${c.id===circleId?on:""}"
     onclick="A.setCircle(${c.id})">${esc(c.name)}</button>`).join("")+`</div>`}

/* ────────── RENDER ────────── */
function render(){
 const app=document.getElementById("app");
 const y=window.scrollY;
 if(!loggedIn()||screen==="login"){app.innerHTML=loginScreen();return}
 if(screen==="add"){app.innerHTML=addScreen();return}
 if(screen==="admin"){app.innerHTML=adminScreen();return}
 if(screen==="sync"){app.innerHTML=syncScreen();return}
 if(!me||!myCfg()){app.innerHTML=loginScreen();return}
 const cfg=myCfg();
 let h=`<div class="flex between center mb18">
  <div class="flex center gap3">
   <div class="hd" style="height:36px;background:${colorOf(me)}"></div>
   <div><div class="eyebrow">Ahd daftari</div>
    <div style="font-family:var(--serif);font-size:21px;margin-top:2px">${esc(first(cfg.name))}
     <span class="muted" style="font-size:13px">· ${esc(cfg.city)}</span></div></div>
  </div>
  <div class="flex gap2">
   <button class="btn" title="${online?"Ulangan":"Oflayn"}" onclick="A.refresh()">
     <span class="dot" style="background:${online?"var(--jade)":"var(--clay)"}"></span>↻</button>
   <button class="btn" onclick="A.go('sync')">⚙</button>
  </div></div>
 <div class="ayat mb18"><span class="brass">❝</span><span>${AYAT[new Date(date+"T12:00:00").getDate()%AYAT.length]}</span></div>`;
 h+=circleSwitcher(circles);
 h+= tab==="today"?todayTab():tab==="stats"?statsTab():tab==="sunnat"?sunnatTab():tab==="book"?bookTab():tab==="nishon"?nishonTab():taskTab();
 h+=`<div class="tabbar"><div>
  <button class="${tab==="today"?"on":""}" onclick="A.setTab('today')"><span>📋</span>Bugun</button>
  <button class="${tab==="stats"?"on":""}" onclick="A.setTab('stats')"><span>📊</span>Reyting</button>
  <button class="${tab==="sunnat"?"on":""}" onclick="A.setTab('sunnat')"><span>📖</span>Sunnat</button>
  <button class="${tab==="book"?"on":""}" onclick="A.setTab('book')"><span>📚</span>Kitob</button>
  <button class="${tab==="nishon"?"on":""}" onclick="A.setTab('nishon')"><span>🏅</span>Nishon</button>
  <button class="${tab==="task"?"on":""}" onclick="A.setTab('task')"><span>🔥</span>Vazifa</button>
 </div></div>`;
 app.innerHTML=h;
 window.scrollTo(0,y)}

A.boot();
</script>
</body>
</html>
