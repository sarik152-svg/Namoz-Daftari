.p14{padding:14px}.p18{padding:18px}

.btn:active{opacity:.7}

.btn-green{background:var(--jade);color:#08140F;border:none;font-weight:600}

      border:1px solid var(--line);color:var(--mut);display:flex;align-items:center;justify-content:center;font-size:20px}
.input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
      border-radius:9px;padding:10px 11px;font-family:var(--sans);font-size:13px;outline:none}
textarea{line-height:1.6;resize:vertical}
.label{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin:16px 0 7px}
.row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.row span:first-child{color:var(--mut)}
.stat{padding:12px;text-align:center}
.stat b{font-family:var(--serif);font-size:25px;font-weight:400;display:block;line-height:1}
.stat i{font-style:normal;font-size:10px;color:var(--mut);display:block;margin-top:5px}
.bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;display:flex}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(13,18,32,.95);border-top:1px solid var(--line);
        backdrop-filter:blur(8px);padding-bottom:env(safe-area-inset-bottom)}
.tabbar div{max-width:560px;margin:0 auto;display:flex}
.tabbar button{flex:1;padding:11px 0 14px;background:none;border:none;cursor:pointer;color:var(--mut);
        display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;letter-spacing:.05em}
.tabbar button.on{color:var(--brass)}
.ayat{display:flex;gap:8px;padding:10px 12px;background:var(--panel);border-left:2px solid var(--brass);
      border-radius:0 10px 10px 0;font-family:var(--serif);font-size:13.5px;color:var(--mut);line-height:1.55;font-style:italic}
.pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--mut)}.small{font-size:11px}.tiny{font-size:10.5px}
.jade{color:var(--jade)}.clay{color:var(--clay)}.brass{color:var(--brass)}
.arc{position:relative;height:6px;border-radius:3px;background:var(--panel2);
     background-image:linear-gradient(90deg,#4CAF8B55,#4CAF8B33 55%,#C9A22744)}
.arc i{position:absolute;top:-3px;width:6px;height:12px;border-radius:2px;background:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.pname{font-family:var(--serif);font-size:17px}
.chip{font-size:9px;border:1px solid #C9A22755;color:var(--brass);border-radius:4px;padding:1px 5px}
.hd{width:6px;border-radius:3px}
.sw{width:22px;height:22px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;padding:0}
.sw.on{background:var(--brass);border-color:var(--brass)}
.link{background:none;border:none;color:var(--brass);font-size:12px;cursor:pointer;padding:8px 0}

<script>
/* ══════════════ SOZLAMALAR ══════════════ */
/* Rang a'zoning ro'yxatdagi o'rniga qarab beriladi. Pushti ikki rang bu yerdan
   olib tashlandi — ular hech kimga to'g'ri kelmadi va tanlash imkoni yo'q, ya'ni
   navbat kimga tushsa o'shaniki bo'lardi. Qolganlari bir-biridan yetarlicha uzoq. */
const PALETTE=["#C9A227","#4CAF8B","#6C8CD5","#E0885A","#58BFC9","#9BC95E","#C0864F","#A88FE0"];
const P_QAZO=0.25,P_MISS=1,STREAK_STEP=10;
/* Qarz — o'qilmagan namoz uchun jazo, boshqa hech nima emas. Uni hech narsa
   kamaytirmaydi: na tahajjud, na jamoat, na uzilgan qazo, na bajarilgan vazifa.
   Vazifa qarzni to'lamaydi — u jazoning o'zi. Qarz esa har oy boshida noldan
   boshlanadi, bajarilmagan vazifa esa keyingi oyga ham o'tib boradi. */
const JAZO=[{ball:5,rak:12,tas:500},{ball:7,rak:20,tas:1000},{ball:10,rak:26,tas:2000}];
const jazoDaraja=qarz=>{let n=0;JAZO.forEach((j,i)=>{if(qarz>=j.ball)n=i+1});return n};
/* Kitob qoidalari. Ball namoz balidan ALOHIDA yuritiladi — ikkalasi bir
   hisobga qo'shilsa, o'qimagan kun namoz qarzini oshirib yuborardi. */
/* Tahajjud nafl: hech qachon minus bermaydi, aksincha qarzni kamaytiradi. */
const NAFL_BALL=1.5;
/* Jamoat bilan o'qilgan farz namoz yolg'iz o'qilganidan ustun: reytingda 1 emas,
   1,5 ball. Faqat VAQTIDA o'qilganiga beriladi. */
const JAMOAT_BALL=0.5;
/* Eski qazolar: yoshlikda o'qilmay qolgan namozlar. Bugungi namozni kechikib
   o'qish («qazo» holati, −0,25) bilan hech qanday aloqasi yo'q — u minus, bu
   plyus. Shuning uchun ilovada ular hech qachon bir xil so'z bilan atalmaydi.
   Ball tahajjudnikiga teng, lekin alohida: qoidalari boshqa. */
const QAZO_BALL=0.25,QAZO_MAX=20;
const QAZO_VAQT=["bomdod","peshin","asr","shom","xufton"];
/* Ish rejimi. Peshin, asr va shomning vaqti ish smenasining ichida o'tadi, uyga
   kelgach uchalasi birdan o'qiladi. Shu kun ichida qazo qilib o'qilgani vaqtida
   deb hisoblanadi — aks holda daftar odamning namozini emas, ishini yozib borardi.
   Bomdod, xufton, tahajjud va eski qazolar hammaniki kabi baholanadi, keyingi
   kunga qolgan namoz esa baribir −1: yengillik smenaga, kechiktirishga emas.
   Qoida shu yagona joyda turadi va holat o'qiladigan hamma yerdan shu chaqiriladi. */
const ISH_VAQT=["peshin","asr","shom"];
/* Ayollar rejimi. Vaqtida o'qilgani hammanikidek, kun yopilib ketgani ham
   hammanikidek −1. Faqat oradagi holat o'zgaradi: shu kun ichida kechikib
   o'qilgani jarima emas, +0,25 ball. Ish rejimidan yengilroq — u bunday namozni
   vaqtida deb sanaydi, bu esa uni o'z holicha qoldirib, faqat qarz bo'lishdan
   to'xtatadi. */
const AYOL_BALL=0.25;
const ayolRejimi=c=>!!(c&&c.woman_mode);
/* `c` — a'zoning o'zi yoki cfgNow/cfgAt qaytargan nusxasi; ikkalasida ham bayroq bor. */
const holat=(c,pk,r)=>!r?null
 :(r.s==="qazo"&&c&&c.work_shift&&ISH_VAQT.indexOf(pk)>=0)?"ontime":r.s;
/* Bir kunda o'qilgan eski qazolar soni. */
const qazoOf=day=>{const q=(day&&day.qazo)||{};
 return QAZO_VAQT.reduce((n,k)=>n+(q[k]||0),0)};
const BET_NORMA=10;
const K_KAM=0.5,K_NOL=1,K_NOTE=0.5,K_DONE=5,K_TASK_AT=4,K_TASK_BET=30;

const CITIES=[
 {n:"Toshkent",lat:41.2995,lng:69.2401,tz:5,asr:2,fa:18,ia:18},
 {n:"Samarqand",lat:39.627,lng:66.975,tz:5,asr:2,fa:18,ia:18},
 {n:"Buxoro",lat:39.767,lng:64.423,tz:5,asr:2,fa:18,ia:18},
 {n:"Andijon",lat:40.783,lng:72.333,tz:5,asr:2,fa:18,ia:18},
 {n:"Farg'ona",lat:40.386,lng:71.787,tz:5,asr:2,fa:18,ia:18},
 {n:"Namangan",lat:40.998,lng:71.673,tz:5,asr:2,fa:18,ia:18},
 {n:"Qarshi",lat:38.86,lng:65.79,tz:5,asr:2,fa:18,ia:18},
 {n:"Nukus",lat:42.46,lng:59.61,tz:5,asr:2,fa:18,ia:18},

 {n:"Jidda",lat:21.543,lng:39.173,tz:3,asr:1,fa:18.5,ia:18.5},

 {n:"Doha",lat:25.286,lng:51.531,tz:3,asr:1,fa:18,ia:18},
 {n:"Istanbul",lat:41.008,lng:28.978,tz:3,asr:2,fa:18,ia:17},
 {n:"Moskva",lat:55.756,lng:37.617,tz:3,asr:2,fa:18,ia:17},
 {n:"Almati",lat:43.238,lng:76.889,tz:5,asr:2,fa:18,ia:18},
 {n:"Bishkek",lat:42.874,lng:74.612,tz:6,asr:2,fa:18,ia:18},
 {n:"Dushanbe",lat:38.56,lng:68.787,tz:5,asr:2,fa:18,ia:18},
 {n:"Kuala-Lumpur",lat:3.139,lng:101.687,tz:8,asr:1,fa:20,ia:18},
 {n:"Seul",lat:37.567,lng:126.978,tz:9,asr:2,fa:18,ia:17},
 {n:"London",lat:51.507,lng:-0.128,tz:1,asr:2,fa:18,ia:17},
 {n:"Berlin",lat:52.52,lng:13.405,tz:2,asr:2,fa:18,ia:17},
 {n:"Nyu-York",lat:40.713,lng:-74.006,tz:-4,asr:2,fa:18,ia:17}
];
/* Bo'sh: bu ro'yxat sahifa manbasida turadi va uni ochgan har kim o'qiy oladi.
   Haqiqiy a'zolar /state dan keladi. */
const DEFAULT_MEMBERS=[];

/* ══════════════ NAMOZ VAQTI ══════════════ */
const D2R=Math.PI/180;
const sinD=d=>Math.sin(d*D2R),cosD=d=>Math.cos(d*D2R),tanD=d=>Math.tan(d*D2R);
const asinD=x=>Math.asin(x)/D2R,acosD=x=>Math.acos(x)/D2R;
const atan2D=(y,x)=>Math.atan2(y,x)/D2R,acotD=x=>Math.atan(1/x)/D2R;
const fixn=(a,b)=>{a-=b*Math.floor(a/b);return a<0?a+b:a};
const fixAng=a=>fixn(a,360),fixHr=a=>fixn(a,24);
function julian(y,m,d){if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
 return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){const D=jd-2451545,g=fixAng(357.529+.98560028*D),q=fixAng(280.459+.98564736*D);
 const L=fixAng(q+1.915*sinD(g)+.02*sinD(2*g)),e=23.439-.00000036*D;
 const RA=fixHr(atan2D(cosD(e)*sinD(L),cosD(L))/15);
 return{decl:asinD(sinD(e)*sinD(L)),eqt:q/15-RA}}
function calcTimes(date,c){
 const jd=julian(date.getFullYear(),date.getMonth()+1,date.getDate())-c.lng/(15*24);
 const midDay=t=>fixHr(12-sunPos(jd+t).eqt);
 const at=(ang,t,ccw)=>{const dc=sunPos(jd+t).decl;
   let x=(-sinD(ang)-sinD(dc)*sinD(c.lat))/(cosD(dc)*cosD(c.lat));x=Math.max(-1,Math.min(1,x));
   return midDay(t)+(ccw?-1:1)*(acosD(x)/15)};
 const asrT=(f,t)=>{const dc=sunPos(jd+t).decl;return at(-acotD(f+tanD(Math.abs(c.lat-dc))),t,false)};
 let t={fajr:5/24,sunrise:6/24,dhuhr:.5,asr:13/24,maghrib:.75,isha:19/24};
 for(let i=0;i<3;i++){t={fajr:at(c.fa,t.fajr,true)/24,sunrise:at(.833,t.sunrise,true)/24,
   dhuhr:(midDay(t.dhuhr)+1/60)/24,asr:asrT(c.asr,t.asr)/24,
   maghrib:at(.833,t.maghrib,false)/24,isha:at(c.ia,t.isha,false)/24}}
 const off=c.tz-c.lng/15,o={};for(const k in t)o[k]=fixHr(t[k]*24+off);return o}
function daySchedule(date,c){
 const T=calcTimes(date,c);
 const pv=new Date(date);pv.setDate(pv.getDate()-1);
 const nx=new Date(date);nx.setDate(nx.getDate()+1);
 const P=calcTimes(pv,c),N=calcTimes(nx,c),nl=24-P.maghrib+T.fajr;
 /* Xufton oynasi yarim tundan o'tib, ERTANGI bomdodda yopiladi. Ilgari bu yerda
    shu kunning bomdodi turardi — u xufton boshlanishidan oldin bo'lgani uchun
    oyna teskari hisoblanib, xufton keyingi kunga surilib ketardi. */
 return{tahajjud:fixHr(P.maghrib+2/3*nl),bomdod:T.fajr,peshin:T.dhuhr,asr:T.asr,shom:T.maghrib,xufton:T.isha,
  endTahajjud:T.fajr,endBomdod:T.sunrise,endPeshin:T.asr,endAsr:T.maghrib,endShom:T.isha,endXufton:N.fajr}}
const hm=d=>{if(d==null||isNaN(d))return"--:--";const m=fixn(Math.round(d*60),1440);
 return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const toMin=s=>{const p=String(s).split(":");return +p[0]*60+ +p[1]};
const diffMin=(a,b)=>{let d=toMin(b)-toMin(a);if(d<-720)d+=1440;if(d>720)d-=1440;return d};
const winLen=(s,e)=>{let d=toMin(e)-toMin(s);if(d<=0)d+=1440;return d};
const inWin=(n,s,e)=>e>s?(n>=s&&n<e):(n>=s||n<e);

/* Bitta belgining bali — reyting qanday sanasa, shunday. prayerRange ichidagi
   qoidalar bilan bir xil bo'lishi shart; test ikkalasining yig'indisini
   solishtirib turadi. */
function belgiBall(c,p,r,st){
 if(!r)return 0;
 if(!p.fard)return st==="ontime"?NAFL_BALL:0;
 if(st==="ontime")return 1+(r.j?JAMOAT_BALL:0);
 if(st==="qazo")return ayolRejimi(c)?AYOL_BALL:-P_QAZO;
 return -P_MISS}

/* ══════════════ QAYSI KUN, QAYSI VAQT ══════════════ */
/* Baho har doim a'zoning SHAHRI vaqtida chiqariladi. Telefon boshqa mintaqada
   bo'lsa (masalan Dubay profili bilan Toshkentda yurish) qurilma soati namoz
   jadvaliga to'g'ri kelmaydi va vaqtida o'qilgan namoz qazo bo'lib ko'rinadi. */
function nowFor(c){
 const d=new Date();
 return new Date(d.getTime()+d.getTimezoneOffset()*60000+((c&&c.tz!=null?c.tz:0)*3600000))}
const todayFor=c=>today(nowFor(c));
const decOf=d=>d.getHours()+d.getMinutes()/60;
const PR=k=>{const p=PRAYERS.find(x=>x.k===k);return p?p.n:k};

/* Namoz qaysi kunning daftariga tushishi kerak.
   Xufton yagona yarim tunni kesib o'tadigan vaqt: soat 00:00 dan bomdodgacha
   o'qilgan xufton — KECHAGI kunning xuftoni. Shu shart bo'lmasa u ertangi kunga
   yozilib, kechagi kun esa o'qilmagan bo'lib qolar edi. */
function liveDay(pk,c){
 const n=nowFor(c),ds=today(n);
 if(pk!=="xufton")return ds;
 return decOf(n)<daySchedule(new Date(ds+"T12:00:00"),c).bomdod?shift(ds,-1):ds}

/* Oyna holati: "open" — vaqti kirgan, "early" — hali kirmagan, "past" — o'tib ketgan. */
function winState(pk,ds,c){
 const sc=daySchedule(new Date(ds+"T12:00:00"),c),n=decOf(nowFor(c));
 if(inWin(n,sc[pk],sc[EKY[pk]]))return "open";
 return n<sc[pk]?"early":"past"}

/* ══════════════ NAMOZLAR / MATNLAR ══════════════ */
const PRAYERS=[
 {k:"tahajjud",n:"Tahajjud",ic:"☾",fard:false},
 {k:"bomdod",n:"Bomdod",ic:"◐",fard:true},
 {k:"peshin",n:"Peshin",ic:"☀",fard:true},
 {k:"asr",n:"Asr",ic:"◑",fard:true},
 {k:"shom",n:"Shom",ic:"◒",fard:true},
 {k:"xufton",n:"Xufton",ic:"✦",fard:true}
];
const EKY={tahajjud:"endTahajjud",bomdod:"endBomdod",peshin:"endPeshin",asr:"endAsr",shom:"endShom",xufton:"endXufton"};
/* STATUS.ball ilgari QARZ shkalasida edi: vaqtida o'qilgan namoz 0, jamoat esa
   faqat ustiga qo'shiladigan yarim ball. Shu sababli bitta jamoat namozi Bugun
   sahifasida +0,5, reytingda esa +1,5 bo'lib ko'rinardi. Endi ball bitta shkalada
   — reytingdagida — va u `belgiBall` orqali hisoblanadi. STATUS faqat nom va rang
   uchun qoldi. */
const STATUS={
 ontime:{label:"Vaqtida",color:"var(--jade)"},
 qazo:{label:"Qazo (kun ichida)",color:"var(--brass)"},
 late:{label:"Keyingi kunda qazo",color:"var(--clay)"},
 missed:{label:"O'qilmagan",color:"var(--clay)"}
};
const SUNNATS=[
{t:"Salomni birinchi berish",d:"Kichik kattaga, yurgan o'tirganga, ozchilik ko'pchilikka salom beradi. Salom — muhabbatning kaliti.",a:"Bugun kamida 5 kishiga birinchi bo'lib salom bering.",s:"Buxoriy, 6231; Muslim, 2160"},
{t:"Har ishni o'ngdan boshlash",d:"Payg'ambarimiz (s.a.v.) poyabzal kiyish, taharat olish, taomlanish va tarashda o'ng tomonni ma'qul ko'rardilar.",a:"Bugun har bir ishni ongli ravishda o'ngdan boshlang.",s:"Buxoriy, 168; Muslim, 268"},
{t:"Bismillah bilan boshlash",d:"Taomdan avval «Bismillah», unutilsa «Bismillahi avvalahu va oxirahu» aytiladi. So'ngida «Alhamdulillah».",a:"Har ovqatda ovoz chiqarib ayting — bola-chaqa ham eshitsin.",s:"Abu Dovud, 3767; Termiziy, 1858 — hasan sahih"},
{t:"Qorinning uchdan biri",d:"Odam farzandi qorindan yomonroq idishni to'ldirmagan: uchdan biri taom, uchdan biri suv, uchdan biri nafas uchun.",a:"Bugun to'yishga bir qoshiq qolganda dasturxondan turing.",s:"Termiziy, 2380; Ibn Moja, 3349 — hasan"},

};

const API="/api/v1";

const hdrs=()=>{const h={"Content-Type":"application/json"};
 if(token)h["Authorization"]="Bearer "+token;return h};
async function api(path,opts){
 const r=await fetch(API+path,Object.assign({cache:"no-store",headers:hdrs()},opts||{}));
 if(r.status===401&&token){forgetSession();
   const e=new Error("Sessiya tugadi");e.status=401;throw e}
 if(!r.ok){let msg="";try{const j=await r.json();msg=(j.error&&j.error.message)||""}catch(e){}
  const err=new Error(msg||("HTTP "+r.status));err.status=r.status;throw err}
 return r.status===204?null:r.json()}
function forgetSession(){
 token="";isAdmin=false;LS.set("nd_token","");LS.set("nd_admin",false);
 me=null;LS.set("nd_me",null);
 circles=[];circleId=null;LS.set("nd_circles",circles);LS.set("nd_circle",circleId);
 screen="login"}

/* Marks made while offline wait here. pull() replaces local data with the
   server's copy, so anything not yet sent must be flushed first or it is lost. */
let outbox=LS.get("nd_outbox",[]);
const setOutbox=v=>{outbox=v;LS.set("nd_outbox",outbox)};
const rememberFailure=(id,d)=>{
 if(!outbox.some(o=>o.id===id&&o.d===d))setOutbox(outbox.concat([{id:id,d:d}]))};
const clearFailure=(id,d)=>setOutbox(outbox.filter(o=>!(o.id===id&&o.d===d)));
const PERMANENT=[401,403,404,422];
async function flushOutbox(){
 for(const o of outbox.slice()){
  try{await sendDay(o.id,o.d);clearFailure(o.id,o.d)}
  catch(e){
    if(PERMANENT.indexOf(e.status)>=0){clearFailure(o.id,o.d);continue}
    return false}}
 return true}

async function pull(){
 if(!loggedIn())return false;
 if(!await flushOutbox()){
   online=false;syncMsg="saqlanmagan belgilar bor - qayta urinilmoqda";return false}
 try{
   const j=await api(circleId?"/state?circle="+encodeURIComponent(circleId):"/state");
   members=j.members;data={};
   calls=j.calls||[];khatm=j.khatm||null;duels=j.duels||[];
   members.forEach(m=>{data[m.id]=Object.assign(blank(),j.data[m.id]||{})});
   LS.set("nd_members",members);LS.set("nd_data",data);
   online=true;syncMsg="";return true;
 }catch(e){online=false;syncMsg=e.status===401?"":"ulanmadi";return false}
}
async function pushMembers(){LS.set("nd_members",members)}
async function pushData(id){
 LS.set("nd_data",data);
 if(!loggedIn())return;
 try{
   await api("/members/"+encodeURIComponent(id)+"/data",
     {method:"PUT",body:JSON.stringify(data[id])});
   online=true;syncMsg="";
 }catch(e){online=false;
   syncMsg=e.status===403?"Bu sizning yozuvingiz emas":e.status===429?"Juda ko'p urinish"
     :"saqlanmadi - oflayn"}
}
async function sendDay(id,d){
 const day=((data[id]||{}).days||{})[d]||{};
 await api("/members/"+encodeURIComponent(id)+"/days/"+encodeURIComponent(d),
   {method:"PUT",body:JSON.stringify(day)})}
async function pushDay(id,d){
 LS.set("nd_data",data);
 if(!loggedIn())return;
 try{
   await sendDay(id,d);clearFailure(id,d);online=true;syncMsg="";
 }catch(e){online=false;
   if(PERMANENT.indexOf(e.status)<0)rememberFailure(id,d);
   syncMsg=e.status===403?"Bu sizning yozuvingiz emas":e.status===429?"Juda ko'p urinish"
     :"saqlanmadi - keyin yuboriladi"}
}

/* A'zolar safarga chiqadi, namoz vaqti esa ular TURGAN shahar bo'yicha bo'lishi
   kerak. Shuning uchun shahar profilda almashtirilmaydi, sanali ro'yxatga
   yoziladi: «shu kundan boshlab — mana bu shaharda». Shunda boshqa shaharga
   ko'chish o'tgan kunlarning vaqtlarini qayta yozib yubormaydi. */
const placesOf=m=>((data[m.id]&&data[m.id].places)||[]);
function cfgAt(m,ds){
 let best=null;
 placesOf(m).forEach(p=>{if(p.d<=ds&&(!best||p.d>=best.d))best=p});
 return best?Object.assign({},m,best):m}
function cfgNow(m){
 let best=null;
 placesOf(m).forEach(p=>{if(!best||p.d>=best.d)best=p});
 return best?Object.assign({},m,best):m}

function score(u,c,child){
 const days=(u&&u.days)||{},ds=Object.keys(days).sort();
 const o={penalty:0,ontime:0,qazo:0,bad:0,tahajjud:0,jamoat:0,quran:0,per:{},bonusSum:0,debt:0,eski:0,ayol:0,oylar:{},tasks:((u&&u.tasks)||[]).length};
 /* Jazo oyma-oy yig'iladi: qarz har oy boshida noldan boshlanadi, lekin o'sha oyda
    tushgan vazifa bajarilmasa keyingi oyga o'tib ketadi — shuning uchun har oyning
    jazosi alohida eslab qolinadi. */
 const jaza=(kun,n)=>{o.penalty+=n;o.oylar[kun.slice(0,7)]+=n};
 PRAYERS.forEach(p=>o.per[p.k]={ontime:0,qazo:0,bad:0,delaySum:0,delayN:0});
 ((u&&u.bonuses)||[]).forEach(b=>o.bonusSum+=b.amt);
 /* Kechagi xufton bomdodgacha hali ochiq turadi, shuning uchun kun yopilgan
    bo'lsa ham uni «o'qilmagan» deb jarima yozib bo'lmaydi. */
 const openX=c?liveDay("xufton",c):null;
 if(ds.length){const td=c?todayFor(c):today();let d=ds[0];
  for(let i=0;i<800&&d<=td;i++,d=shift(d,1)){
   const day=days[d]||{},closed=d<td;
   if(o.oylar[d.slice(0,7)]==null)o.oylar[d.slice(0,7)]=0;
   PRAYERS.forEach(p=>{const r=day[p.k],shut=closed&&!(p.k==="xufton"&&d===openX);
    const st=holat(c,p.k,r);
    if(!p.fard){if(st==="ontime"){o.tahajjud++;o.per[p.k].ontime++}return}
    if(!r){if(shut){jaza(d,P_MISS);o.bad++;o.per[p.k].bad++}return}
    if(st==="ontime"){o.ontime++;o.per[p.k].ontime++;if(r.j)o.jamoat++}
    else if(st==="qazo"){o.qazo++;o.per[p.k].qazo++;
     if(ayolRejimi(c))o.ayol++;else jaza(d,P_QAZO)}
    else{jaza(d,P_MISS);o.bad++;o.per[p.k].bad++}});
   o.eski+=qazoOf(day);
   if(day.quran)o.quran++}}
 /* Qarz — SHU OYNING jazosi, boshqa hech nima. Ilgari uni tahajjud, jamoat,
    uzilgan qazo, mukofot va bajarilgan vazifa kamaytirardi; endi kamaytirmaydi.
    Qarz o'qilmagan namoz uchun jazo, savob esa reytingda o'z joyida sanaladi. */
 o.debt=o.oylar[(c?todayFor(c):today()).slice(0,7)]||0;
 /* Toza oy — yozuv bo'lgan va bitta ham jazo tushmagan, tugagan oy. */
 const shuOy=(c?todayFor(c):today()).slice(0,7);
 o.tozaOy=Object.keys(o.oylar).filter(k=>k<shuOy&&o.oylar[k]===0).length;
 /* Bolada qarz ham, jarima ham yo'q — faqat yulduzcha. Kattalar tizimi bolani
    ilovadan qo'rqitib yuboradi, undan ko'ra o'qiganini sanab turgani ma'qul. */
 o.stars=o.ontime+o.tahajjud;
 if(child){o.penalty=0;o.debt=0;o.tasks=0;o.oylar={}}
 return o}
function streakOf(days,pk,c){let cur=c?todayFor(c):today(),n=0;
 const oq=d=>holat(c,pk,(days[d]||{})[pk])==="ontime";
 if(!oq(cur))cur=shift(cur,-1);
 for(let i=0;i<400;i++){if(oq(cur)){n++;cur=shift(cur,-1)}else break}
 return n}
const claimed=(u,pk)=>((u&&u.bonuses)||[]).filter(b=>b.p===pk).reduce((m,b)=>Math.max(m,b.lvl),0);

/* ══════════════ KITOB HISOBI ══════════════ */
const bookRead=b=>(b.log||[]).reduce((s,e)=>s+e.p,0);
const bookOpenOn=(b,ds)=>b.started<=ds&&(!b.finished||b.finished>=ds);
const dayPages=(u,ds)=>((u&&u.books)||[]).reduce((s,b)=>{
 const e=(b.log||[]).find(x=>x.d===ds);return s+(e?e.p:0)},0);
const daysBetween=(a,z)=>Math.round((new Date(z+"T12:00:00")-new Date(a+"T12:00:00"))/86400000);

/* O'qish tezligi kitob boshlangandan beri o'tgan HAR BIR kunga bo'linadi, faqat
   o'qilgan kunlarga emas — «kuniga nechi bet» degani shu, va tashlab qo'yilgan
   kunlar tugash muddatini uzaytirib ko'rsatadi. */
function bookPace(b,td){
 const read=bookRead(b),qoldi=Math.max(0,b.pages-read);
 const kun=Math.max(1,daysBetween(b.started,b.finished||td)+1);
 const tezlik=read/kun;
 const kunQoldi=qoldi<=0?0:(tezlik>0?Math.ceil(qoldi/tezlik):null);
 return{read,qoldi,kun,tezlik,kunQoldi,foiz:Math.min(100,Math.round(read/b.pages*100)),
  tugash:kunQoldi?shift(td,kunQoldi):null}}

/* Ochiq kitobi bor har bir YOPILGAN kun baholanadi: norma bajarilsa 0,
   kam o'qilsa −0,5, umuman o'qilmasa −1. Zametka +0,5, tugatilgan kitob +5. */
function bookScore(u,c){
 const bs=(u&&u.books)||[];
 const o={penalty:0,bonus:0,debt:0,kun:0,toliq:0,kam:0,nol:0,bet:0,notes:0,done:0,streak:0,ochiq:0};
 bs.forEach(b=>{o.bet+=bookRead(b);o.notes+=(b.notes||[]).length;
  if(b.finished)o.done++;else o.ochiq++});
 o.bonus=o.notes*K_NOTE+o.done*K_DONE;
 if(!bs.length)return o;
 const td=c?todayFor(c):today();
 let d=bs.map(b=>b.started).sort()[0];
 for(let i=0;i<800&&d<td;i++,d=shift(d,1)){
  if(!bs.some(b=>bookOpenOn(b,d)))continue;
  o.kun++;const bet=dayPages(u,d);
  if(bet>=BET_NORMA)o.toliq++;
  else if(bet>0){o.kam++;o.penalty+=K_KAM}
  else{o.nol++;o.penalty+=K_NOL}}
 o.debt=o.penalty-o.bonus;
 o.streak=bookStreak(u,c);
 return o}

function bookStreak(u,c){
 let cur=c?todayFor(c):today(),n=0;
 if(dayPages(u,cur)<BET_NORMA)cur=shift(cur,-1);
 for(let i=0;i<400;i++){if(dayPages(u,cur)>=BET_NORMA){n++;cur=shift(cur,-1)}else break}
 return n}

/* ══════════════ HAFTA VA OY QAHRAMONI ══════════════ */
/* Hafta dushanbadan yakshanbagacha. Natija yakshanba kuni xufton vaqti
   kirgandan keyin — ya'ni haftaning oxirgi namoz vaqtidan keyin — yakuniy
   bo'ladi; undan oldin «hozircha» deb ko'rsatiladi. */
function weekRange(ds){
 const dow=(new Date(ds+"T12:00:00").getDay()+6)%7;
 return[shift(ds,-dow),shift(ds,6-dow)]}
function monthRange(ds){
 const d=new Date(ds+"T12:00:00"),y=d.getFullYear(),m=d.getMonth();
 const pad=n=>String(n).padStart(2,"0");
 return[y+"-"+pad(m+1)+"-01",y+"-"+pad(m+1)+"-"+pad(new Date(y,m+1,0).getDate())];}
function yearRange(ds){const y=ds.slice(0,4);return[y+"-01-01",y+"-12-31"]}
function oyOraliq(y,m){
 const pad=n=>String(n).padStart(2,"0");
 return[y+"-"+pad(m+1)+"-01",y+"-"+pad(m+1)+"-"+pad(new Date(y,m+1,0).getDate())]}

function periodDone(z,c){
 const td=todayFor(c);
 if(td>z)return true;
 if(td<z)return false;
 return winState("xufton",z,c)!=="early"}

/* Oraliqdagi namoz bali: vaqtida +1, qazo −0,25, o'qilmagan −1.
   Tahajjud nafl — faqat qo'shadi, hech qachon kamaytirmaydi. */
function prayerRange(u,m,a,z){
 const c=cfgNow(m),days=(u&&u.days)||{},td=todayFor(c),openX=liveDay("xufton",c);
 /* Hisob a'zo daftar tuta boshlagan kundan boshlanadi — score() dagidek. Aks holda
    guruhga keyin qo'shilgan odam o'zi yo'q kunlar uchun jarima olib qolardi. */
 const boshi=Object.keys(days).sort()[0];
 /* `qazo` — shu kun ichida kechikib o'qilganlar (minus). `eski` — yillar oldin
    qolib ketgan, endi uzilgan qazolar (plyus). Ikkalasi butunlay boshqa narsa,
    shuning uchun nomi ham boshqa: bittasini ikkinchisi bilan chalkashtirish shu
    yerda eng oson qilinadigan xato. */
 const o={ontime:0,qazo:0,bad:0,tahajjud:0,jamoat:0,eski:0,ball:0};
 if(!boshi)return o;
 /* Chegara bir yilga yetishi kerak: ilgari 40 kun edi va yil bo'yicha hisob
    jimgina fevralda to'xtab qolardi. */
 for(let d=a<boshi?boshi:a,i=0;i<400&&d<=z;i++,d=shift(d,1)){
  if(d>td)break;
  const day=days[d]||{},closed=d<td;
  PRAYERS.forEach(p=>{const r=day[p.k],shut=closed&&!(p.k==="xufton"&&d===openX);
   const st=holat(c,p.k,r);
   if(!p.fard){if(st==="ontime"){o.tahajjud++;o.ball+=NAFL_BALL}return}
   if(!r){if(shut){o.bad++;o.ball-=P_MISS}return}
   if(st==="ontime"){o.ontime++;o.ball+=1;if(r.j){o.jamoat++;o.ball+=JAMOAT_BALL}}
   else if(st==="qazo"){o.qazo++;o.ball+=ayolRejimi(c)?AYOL_BALL:-P_QAZO}
   else{o.bad++;o.ball-=P_MISS}});
  o.eski+=qazoOf(day);o.ball+=qazoOf(day)*QAZO_BALL}
 return o}

/* Kitob bali: har normalik bet 1 ball, zametka +0,5, tugatilgan kitob +5. */
function bookRange(u,a,z){
 const o={bet:0,notes:0,done:0,ball:0};
 ((u&&u.books)||[]).forEach(b=>{
  (b.log||[]).forEach(e=>{if(e.d>=a&&e.d<=z)o.bet+=e.p});
  (b.notes||[]).forEach(n=>{if(n.d>=a&&n.d<=z)o.notes++});
  if(b.finished&&b.finished>=a&&b.finished<=z)o.done++});
 o.ball=o.bet/BET_NORMA+o.notes*K_NOTE+o.done*K_DONE;
 return o}

function rankBy(a,z,kind){
 return members.map(m=>{
  const u=data[m.id]||blank();
  const o=kind==="namoz"?prayerRange(u,m,a,z):bookRange(u,a,z);
  return{m:m,o:o,ball:o.ball}}).sort((x,y)=>y.ball-x.ball)}

/* Olimpiada uslubidagi kursi: 2-o'rin chapda, 1-o'rin o'rtada va balandroq,
   3-o'rin o'ngda. Faqat NAMOZ bo'yicha — kitob reytingi Kitob bo'limida turadi. */
function podium(nom,a,z,done){
 const r=rankBy(a,z,"namoz"),top=r.slice(0,4),rest=r.slice(4);
 /* To'rtinchi o'rin medalsiz: u kursida turadi, lekin rangi ham, balandligi ham
    uchtasinikidan past — ko'z darrov medalliklarni ajratib olsin. */
 /* To'rtinchi rang — bronzadan keyingisi: quyuqroq, o'chgan bronza. Medali ham
    xuddi shundaqa, ustida faqat 4 raqami turadi. */
 const H=[96,72,58,46],C=["#C9A227","#98A3B8","#C0864F","#8A7A63"];
 const MED=["\u{1F947}","\u{1F948}","\u{1F949}",null];
 /* Uch medal — emoji, to'rtinchisi chizib beriladi: emoji to'plamida bronzadan
    keyingi medal yo'q, "4" yozilgani esa bor-yo'g'i raqam bo'lib qolardi. */
 const medal=(i,katta)=>MED[i]||`<span style="display:inline-flex;align-items:center;
   justify-content:center;width:${katta?26:21}px;height:${katta?26:21}px;border-radius:50%;
   background:linear-gradient(145deg,#A08B6E,#6E6153);border:1px solid #B49A78;
   color:#F2E9DA;font-family:var(--serif);font-size:${katta?15:12}px;line-height:1">4</span>`;
 let h=`<div class="panel p18 mb14" style="border-color:${done?"#4CAF8B55":"#C9A22744"}">
  <div class="flex between center" style="margin-bottom:14px">
   <div><div class="eyebrow">${nom}</div>
    <div class="muted small" style="margin-top:3px">${pretty(a)} — ${pretty(z)}</div></div>
   <span class="chip" style="color:${done?"var(--jade)":"var(--brass)"}">${done?"YAKUNIY":"HOZIRCHA"}</span>
  </div>
  <div style="display:flex;align-items:flex-end;justify-content:center;gap:6px">`;
 /* Kursi tartibi: 2-o'rin chapda, 1-o'rin o'rtada va balandroq, keyin 3 va 4. */
 [1,0,2,3].forEach(i=>{
  const x=top[i];if(!x)return;
  h+=`<div style="flex:1;max-width:118px;text-align:center">
   <div style="font-size:${i===0?27:21}px;line-height:1">${medal(i,i===0)}</div>
   <div style="font-family:var(--serif);font-size:${i===0?16:14}px;margin-top:3px;color:${colorOf(x.m.id)};
     overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(first(x.m.name))}</div>
   ${vazifaBelgi(x.m)?`<div style="margin-top:2px">${vazifaBelgi(x.m)}</div>`:""}
   <div style="font-family:var(--serif);font-size:${i===0?25:20}px;line-height:1.15;color:${C[i]}">${fmt(x.ball)}</div>
   <div class="muted tiny" style="margin-bottom:6px">${x.o.ontime} vaqtida${
     x.o.jamoat?" · "+x.o.jamoat+" jamoat":""}</div>
   <div style="height:${H[i]}px;border-radius:11px 11px 0 0;border:1px solid ${C[i]}55;border-bottom:none;
     background:linear-gradient(180deg,${C[i]}33,${C[i]}0d);display:flex;align-items:center;
     justify-content:center;font-family:var(--serif);font-size:27px;color:${C[i]}">${i+1}</div>
  </div>`});
 h+=`</div>`;
 rest.forEach((x,i)=>{
  h+=`<div class="flex between center" style="padding:7px 0;border-top:1px solid var(--line)">
   <span style="font-size:13px"><span class="muted">${i+5}.</span>
    <span style="color:${colorOf(x.m.id)}">${esc(first(x.m.name))}</span> ${vazifaBelgi(x.m)}</span>
   <span class="muted small">${fmt(x.ball)}</span></div>`});
 return h+`</div>`}

/* Bajarilmagan vazifa. Qarz har oy nolga tushadi, jazo esa tushmaydi: o'sha oyda
   tushgan vazifa bajarilmasa, keyingi oyda ham osilib turaveradi va butun doiraga
   ko'rinadi. Eng eskisi qaytariladi — avval eski qarzni yopish kerak. */
function vazifaQarzi(u,m){
 if(!u||(m&&m.is_child))return null;
 const s=score(u,cfgNow(m),false);
 const bajarilgan={};
 ((u.tasks)||[]).forEach(t=>{
  const oy=t.oy||String(t.d||"").slice(0,7);
  if(!oy)return;
  bajarilgan[oy]=Math.max(bajarilgan[oy]||0,t.lvl||1)});
 const oylar=Object.keys(s.oylar).sort();
 for(let i=0;i<oylar.length;i++){
  const oy=oylar[i],kerak=jazoDaraja(s.oylar[oy]);
  if(kerak>(bajarilgan[oy]||0))
   return{oy:oy,daraja:kerak,bajarilgan:bajarilgan[oy]||0,qarz:s.oylar[oy],
     jazo:JAZO[kerak-1]}}
 return null}

/* Doiradagi hamma ko'radigan belgi. Ataylab ko'zga tashlanadi: vazifa tushgan odam
   uni bajarmaguncha ismining yonida turadi. */
function vazifaBelgi(m){
 return vazifaQarzi(data[m.id],m)
  ?`<span class="chip" style="border-color:#C9584B88;color:var(--clay)">\u26A0 VAZIFA</span>`:""}

/* ══════════════ YIL ══════════════ */
/* Oy g'olibi — o'sha oy TUGAGANDA birinchi o'ringa chiqqan odam. Hech qayerda
   saqlanmaydi, har safar yozuvlardan qayta hisoblanadi.
   Bitta muhim shart: o'sha oyda umuman yozuvi bo'lmagan odam hisobga kirmaydi.
   Ball a'zoning birinchi yozuvidan boshlanadi, ya'ni oyni butunlay o'tkazib
   yuborgan odamning bali 0 bo'lib chiqadi va u kelib namoz o'qib, ba'zilarini
   qoldirgan odamni yengib qo'yardi. */
function oyGolibi(y,m){
 const cfg=myCfg(),oraliq=oyOraliq(y,m);
 if(!periodDone(oraliq[1],cfg))return null;
 const jonli=rankBy(oraliq[0],oraliq[1],"namoz").filter(x=>
   (x.o.ontime+x.o.qazo+x.o.bad+x.o.tahajjud+x.o.eski)>0);
 if(!jonli.length)return null;
 /* Teng bo'lsa g'olib yo'q — duelda ham shunday. */
 if(jonli.length>1&&jonli[0].ball===jonli[1].ball)return null;
 return{m:jonli[0].m,ball:jonli[0].ball}}

/* Yilning o'n ikki oyi va har birining g'olibi, hamda kim necha marta olgani. */
function oyQahramonlari(y){
 const rows=[],count={};
 for(let m=0;m<12;m++){
  const g=oyGolibi(y,m);
  rows.push({oy:m,golib:g?g.m:null,ball:g?g.ball:0});
  if(g)count[g.m.id]=(count[g.m.id]||0)+1}
 return{rows:rows,count:count}}

/* Yil sahifasining boshi: kim necha marta oyni birinchi o'rinda tugatgani, va
   tagida o'n ikki oyning ketma-ketligi. Sardor uchun eng muhim raqam shu, shuning
   uchun u eng tepada va eng katta shrift bilan turadi. */
function oyQahramonView(td){
 const cfg=myCfg(),y=+td.slice(0,4),t=oyQahramonlari(y);
 const bor=(members||[]).filter(m=>t.count[m.id])
   .sort((a,b)=>t.count[b.id]-t.count[a.id]);
 let h=`<div class="panel p18 mb14" style="border-color:#C9A22766">
  <div class="eyebrow">Oy qahramonlari \u00B7 ${y}</div>
  <p class="muted small" style="margin:6px 0 4px;line-height:1.6">Oy tugaganda birinchi
   o'rinda tugatgan odam. Yildagi eng katta hisob shu.</p>`;
 if(bor.length){
  bor.forEach((m,i)=>{
   h+=`<div class="flex between center" style="padding:10px 0;border-top:1px solid var(--line)">
    <span class="flex center gap2">
     <span style="font-size:${i===0?24:17}px">${i===0?"\u{1F3C6}":"\u{1F396}\uFE0F"}</span>
     <span style="font-family:var(--serif);font-size:${i===0?22:17}px;color:${colorOf(m.id)}">${
       esc(first(m.name))}</span></span>
    <span style="font-family:var(--serif);font-size:${i===0?32:23}px;color:var(--brass)">${
      t.count[m.id]}<span class="muted" style="font-size:12px"> marta</span></span></div>`});
 }else{
  h+=`<p class="muted small" style="margin-top:12px">Hali birorta oy tugamagan.</p>`}
 h+=`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
  <div class="eyebrow" style="margin-bottom:8px">Oylar bo'yicha</div>`;
 /* Daftar boshlangunga qadar bo'lgan oylar — bo'sh chiziqcha. "G'olib yo'q" deb
    yozish o'sha oyda kimdir urinib ko'rgandek eshitiladi, holbuki ilova hali
    yo'q edi. */
 let eng=null;
 (members||[]).forEach(m=>{const ks=Object.keys((data[m.id]||{}).days||{}).sort();
  if(ks.length&&(!eng||ks[0]<eng))eng=ks[0]});
 t.rows.forEach(r=>{
  const oraliq=oyOraliq(y,r.oy);
  const holat=(oraliq[0]>td||!eng||oraliq[1]<eng)?"\u2014"
    :!periodDone(oraliq[1],cfg)?"davom etmoqda":"g'olib yo'q";
  h+=`<div class="flex between center" style="padding:5px 0;font-size:12.5px">
   <span class="muted" style="text-transform:capitalize">${OY[r.oy]}</span>
   ${r.golib
     ?`<span style="color:${colorOf(r.golib.id)}">${esc(first(r.golib.name))}
        <span class="muted tiny">${fmt(r.ball)}</span></span>`
     :`<span class="muted tiny">${holat}</span>`}</div>`});
 return h+`</div></div>`}

/* Ball qayerdan yig'ilgani. Qatorlar prayerRange bilan bir xil qoidada bo'lishi
   shart: tarkib yig'indisi tepadagi ball bilan teng chiqmasa, u tushuntirish emas,
   yana bitta chalkashlik bo'ladi. Test aynan shu tenglikni ushlab turadi. */
/* Nomlar qisqa: jadval telefonga sig'ishi kerak, aks holda oxirgi odamni ko'rish
   uchun o'ngga surish kerak bo'ladi. "Kechikkan" — shu kun ichida qazo qilingani,
   "Eski qazo" — Qazo daftaridan uzilgani; ikkalasi butunlay boshqa narsa. */
const TARKIB=[
 {n:"Vaqtida",k:"ontime"},
 {n:"Jamoat",k:"jamoat"},
 {n:"Tahajjud",k:"tahajjud"},
 {n:"Kechikkan",k:"qazo"},
 {n:"O'qilmagan",k:"bad"},
 {n:"Eski qazo",k:"eski"}
];
function ballTarkib(m,o,k){
 const c=cfgNow(m);
 if(k==="ontime")return o.ontime;
 if(k==="jamoat")return o.jamoat*JAMOAT_BALL;
 if(k==="tahajjud")return o.tahajjud*NAFL_BALL;
 if(k==="qazo")return o.qazo*(ayolRejimi(c)?AYOL_BALL:-P_QAZO);
 if(k==="bad")return o.bad*-P_MISS;
 if(k==="eski")return o.eski*QAZO_BALL;
 return 0}

function ballTarkibView(a,z){
 const kishi=(members||[]).map(m=>({m:m,o:prayerRange(data[m.id]||blank(),m,a,z)}));
 if(!kishi.length)return "";
 let h=`<div class="panel p14 mb14">
  <div class="flex between center">
   <div><div class="eyebrow">Ball qayerdan</div>
    <div class="muted small" style="margin-top:3px">${pretty(a)} — ${pretty(z)}</div></div>
   <button class="btn" style="font-size:11px" onclick="A.tarkibOch(${A.tarkibOchiq?"false":"true"})">${
     A.tarkibOchiq?"Yopish":"Batafsil"}</button></div>`;
 if(!A.tarkibOchiq)return h+`</div>`;
 /* Bo'sh qatorlar chiqarilmaydi — jadval qanchalik qisqa bo'lsa, shuncha o'qiladi. */
 const qatorlar=TARKIB.filter(r=>kishi.some(x=>x.o[r.k]));
 if(!qatorlar.length)return h+`<p class="muted small" style="margin:10px 0 0">Bu oraliqda hali yozuv yo'q.</p></div>`;
 /* Ustunlar teng bo'linadi va jadval ekranga sig'adi: ilgari oxirgi odamni ko'rish
    uchun o'ngga surish kerak edi. */
 const kat=`padding:5px 2px;text-align:right;white-space:nowrap`;
 h+=`<div style="overflow-x:auto;margin-top:12px">
  <table style="border-collapse:collapse;font-size:12px;width:100%;table-layout:fixed">
   <colgroup><col style="width:84px">${kishi.map(()=>`<col>`).join("")}</colgroup>
   <tr><th style="${kat};text-align:left"></th>${
     kishi.map(x=>`<th style="${kat};color:${colorOf(x.m.id)};font-weight:400;
       font-family:var(--serif);font-size:12px;white-space:normal;word-break:break-word">${
       esc(first(x.m.name))}</th>`).join("")}</tr>`;
 qatorlar.forEach(r=>{
  h+=`<tr style="border-top:1px solid var(--line)">
   <td style="${kat};text-align:left;color:var(--mut);font-size:11px">${r.n}</td>${
    kishi.map(x=>{const n=x.o[r.k],b=ballTarkib(x.m,x.o,r.k);
     return `<td style="${kat}">${n?`${n}<div class="${b<0?"clay":"jade"} tiny">${
       b>0?"+":""}${fmt(b)}</div>`:`<span class="muted">—</span>`}</td>`}).join("")}</tr>`});
 h+=`<tr style="border-top:1px solid var(--brass)">
   <td style="${kat};text-align:left;font-size:11px">Jami</td>${
    kishi.map(x=>`<td style="${kat};font-family:var(--serif);font-size:15px;color:${
      x.o.ball<0?"var(--clay)":"var(--brass)"}">${fmt(x.o.ball)}</td>`).join("")}</tr>`;
 return h+`</table></div>
  <p class="muted tiny" style="margin:9px 0 0;line-height:1.6">Kechikkan — o'sha kun
   ichida qazo qilingani. Eski qazo — Qazo daftaridan uzilgani. O'qilmagan qatoriga
   ilovada belgilanmay qolgan namoz ham kiradi.</p></div>`}

/* ══════════════ DUEL ══════════════ */
/* Ikki kishi yoki ikki juftlik bir hafta ball bo'yicha bellashadi. Natija hech
   qayerda saqlanmaydi: u reyting o'qiydigan o'sha yozuvlardan chiqariladi, shuning
   uchun kursi bilan duel hech qachon bir-biriga zid bo'lolmaydi. Saqlangan natija
   — javobning ikkinchi nusxasi, nusxalar esa vaqt o'tib ajralib ketadi. */
const duelKishi=id=>(members||[]).find(x=>x.id===id)||null;
const duelTomon=(d,n)=>((d&&d.members)||[]).filter(m=>m.side===n)
  .map(m=>duelKishi(m.member_id)).filter(Boolean);
const duelBoshlangan=d=>!!(d&&d.started&&d.ends);
const duelTugagan=(d,td)=>duelBoshlangan(d)&&d.ends<td;
const duelKetmoqda=(d,td)=>duelBoshlangan(d)&&d.ends>=td;
const duelKutmoqda=d=>!!d&&!d.started;
const duelIchidami=(d,id)=>((d&&d.members)||[]).some(m=>m.member_id===id);
const duelTasdiqlanmagan=(d,id)=>((d&&d.members)||[])
  .some(m=>m.member_id===id&&!m.confirmed);

function duelHisob(d){
 const t1=duelTomon(d,1),t2=duelTomon(d,2);
 const yig=list=>Math.round(list.reduce((n,m)=>
   n+prayerRange(data[m.id]||blank(),m,d.started,d.ends).ball,0)*100)/100;
 const b1=duelBoshlangan(d)?yig(t1):0,b2=duelBoshlangan(d)?yig(t2):0;
 /* Teng bo'lsa hech kim yutmaydi — bu durang, g'alaba emas. */
 return{tomon1:t1,tomon2:t2,ball1:b1,ball2:b2,golib:b1>b2?1:b2>b1?2:0}}

/* Kim necha marta yutgani. Faqat tugagan duellar sanaladi: ketayotganining
   hisobi hali o'zgaradi, tasdiqlanmagani esa umuman boshlanmagan. */
function duelYutuq(list){
 const td=todayFor(myCfg()),y={};
 (list||[]).forEach(d=>{
  if(!duelTugagan(d,td))return;
  const r=duelHisob(d);
  if(!r.golib)return;
  (r.golib===1?r.tomon1:r.tomon2).forEach(m=>y[m.id]=(y[m.id]||0)+1)});
 return y}

/* Duel paneli — kursi bilan taqqoslash orasida turadi. */
function duelView(){
 const td=todayFor(myCfg()),ismi=id=>{const m=duelKishi(id);return m?first(m.name):id};
 const yutuq=duelYutuq(duels);
 const menga=(duels||[]).filter(d=>duelKutmoqda(d)&&duelTasdiqlanmagan(d,me));
 const kutmoqda=(duels||[]).filter(d=>duelKutmoqda(d)&&!duelTasdiqlanmagan(d,me));
 const ketmoqda=(duels||[]).filter(d=>duelKetmoqda(d,td));
 const tugagan=(duels||[]).filter(d=>duelTugagan(d,td)).slice(0,3);
 const boshqalar=(members||[]).filter(m=>m.id!==me);
 const tanlov=(id,tashla)=>`<select id="${id}" class="input">${
   (members||[]).filter(m=>!tashla||m.id!==me)

/* Har bir a'zo uchun bir marta hisoblanadigan yig'ma ko'rsatkichlar. Nishonlar
   shu yerdan o'qiladi — alohida saqlanmaydi, chunki hammasi mavjud yozuvlardan
   kelib chiqadi va keyin qoida o'zgarsa o'zi qayta hisoblanadi. */
function perfectStreak(days,c){
 const toliq=d=>{const day=days[d];
  return!!day&&toliqKun(day,c)};
 let cur=todayFor(c),n=0;
 if(!toliq(cur))cur=shift(cur,-1);
 for(let i=0;i<400;i++){if(toliq(cur)){n++;cur=shift(cur,-1)}else break}
 return n}

/* ────────── HAFTALIK JAMOA TOPSHIRIG'I ────────── */
/* "Hammamiz uchun" nishoni har hafta o'zgarmaydi — u ahd. Uning yonida esa har
   hafta boshqa topshiriq turadi, shunda kurashadigan yangi narsa bo'ladi. Qaysi
   topshiriq ekani haftaning o'zidan chiqariladi, hech qayerda saqlanmaydi: nishon
   ham shunday ishlaydi, va shu tufayli hammaning ekranida bir xil chiqadi. */
function haftaJamoa(a,z){
 const kattalar=members.filter(m=>!m.is_child);
 const w={n:kattalar.length,ontime:0,tahajjud:0,jamoat:0,eski:0,
   quran:0,quranKishi:0,mukammal:0,bomdod:0};
 kattalar.forEach(m=>{
  const u=data[m.id]||blank(),o=prayerRange(u,m,a,z),c=cfgNow(m);
  w.ontime+=o.ontime;w.tahajjud+=o.tahajjud;w.jamoat+=o.jamoat;w.eski+=o.eski;
  let qk=0;
  for(let d=a,i=0;i<40&&d<=z;i++,d=shift(d,1)){
   const day=((u.days||{})[d])||{};
   if(day.quran){qk++;w.quran++}
   if(holat(c,"bomdod",day.bomdod)==="ontime")w.bomdod++;
   if(toliqKun(day,c))w.mukammal++}
  if(qk>=5)w.quranKishi++});
 return w}

const HAFTA_EPOX="2026-01-05";
function haftaTopshiriq(a,z){

/* Bir kunda besh vaqt ham vaqtida o'qilganmi. Ish rejimidagi odam uchun kun ichida
   uzilgan peshin/asr/shom ham shu yerda vaqtida deb sanaladi. */
const toliqKun=(day,c)=>
 PRAYERS.filter(p=>p.fard&&holat(c,p.k,day[p.k])==="ontime").length===5;

function nishonStat(m){
 const u=data[m.id]||blank(),c=cfgNow(m),days=u.days||{};
 const s=score(u,c,!!(m&&m.is_child)),k=bookScore(u,c);
 let mukammalKun=0,quranKun=0,jumaMukammal=0;
 Object.keys(days).forEach(d=>{
  const day=days[d];
  if(toliqKun(day,c)){mukammalKun++;if(new Date(d+"T12:00:00").getDay()===5)jumaMukammal++}
  if(day.quran)quranKun++});
 return{s:s,k:k,mukammalKun:mukammalKun,quranKun:quranKun,jumaMukammal:jumaMukammal,
  bomdodStreak:streakOf(days,"bomdod",c),mukammalStreak:perfectStreak(days,c),
  tahajjudStreak:streakOf(days,"tahajjud",c),
  kunlar:Object.keys(days).length,shaharlar:((u.places)||[]).length,
  /* Qarz odamning profilida turadi, hujjatida emas. */
  qazoQarz:(m&&m.qazo_debt)||0}}

/* ══════════════ HAFTALIK JAMOA NISHONI ══════════════ */
/* Hamma bir kishi uchun, bir kishi hamma uchun: nishon HAMMA a'zo o'z
   maqsadiga yetgandagina olinadi. Bittasi yetmasa — hech kim olmaydi. */
/* Maqsad doiraga tegishli, hammaga bitta emas: oilada bola ham, keksa ham bor,
   ularni uch do'st bir-birini tutgan raqam bilan tutib bo'lmaydi. Doira egasi uni
   Sozlamalardan o'zgartiradi; ko'rsatilmagan bo'lsa eskisi — 25. */
const HAFTA_MAQSAD_ODATIY=25;
function weekGoal(){
 const c=(circles||[]).find(x=>x.id===circleId);
 return (c&&c.week_goal)||HAFTA_MAQSAD_ODATIY}
function jamoaHafta(a,z){
 const maqsad=weekGoal();
 /* Bola nishonni to'smaydi. "Bir kishi hamma uchun" kattalar orasidagi ahd —
    olti yoshli bola normaga yetmagani uchun butun oila quruq qolsa, qoida
    ragʻbat emas, jazoga aylanadi. Bolaning o'z yulduzchalari alohida sanaladi. */
 const rows=members.filter(m=>!m.is_child).map(m=>{
  const o=prayerRange(data[m.id]||blank(),m,a,z);
  return{m:m,ontime:o.ontime,jamoat:o.jamoat,ok:o.ontime>=maqsad}});
 const bolalar=members.filter(m=>m.is_child).map(m=>{
  const o=prayerRange(data[m.id]||blank(),m,a,z);
  return{m:m,stars:o.ontime+o.tahajjud}});
 return{rows:rows,bolalar:bolalar,ok:rows.length>0&&rows.every(x=>x.ok)}}
function jamoaTarix(c){
 let eng=null;
 members.forEach(m=>{const ks=Object.keys((data[m.id]||{}).days||{}).sort();
  if(ks.length&&(!eng||ks[0]<eng))eng=ks[0]});
 if(!eng)return 0;
 let n=0,w=weekRange(todayFor(c));
 for(let i=0;i<200;i++){
  w=weekRange(shift(w[0],-1));
  if(w[1]<eng)break;
  if(jamoaHafta(w[0],w[1]).ok)n++}
 return n}

/* Jamoaning barcha zametkalari, eng yangisi tepada. */
function allNotes(){
 const out=[];
 members.forEach(m=>((data[m.id]&&data[m.id].books)||[]).forEach(b=>
  (b.notes||[]).forEach(n=>out.push({m,b,n}))));
 return out.sort((x,y)=>{
  const a=x.n.d+" "+(x.n.t||"00:00"),z=y.n.d+" "+(y.n.t||"00:00");
  return a<z?1:a>z?-1:0})}

 async mark(pk,how,ds){
  const cfg=myCfg(),P=PRAYERS.find(x=>x.k===pk)||{},live=liveDay(pk,cfg);
  /* Xufton bomdodgacha kechagi kunga yoziladi, shuning uchun yoziladigan kun
     ekranda ochiq turgan kundan farq qilishi mumkin. */
  const tgt=ds||(date===todayFor(cfg)?live:date);
  const day=Object.assign({},(data[me].days||{})[tgt]||{});
  /* Belgi bir marta qo'yiladi va keyin o'zgarmaydi. Serverda ham shu qoida bor;
     bu yerdagi tekshiruv shunchaki bekorga so'rov yubormaslik uchun. */
  if(day[pk])return;
  const n=nowFor(cfg);
  const nowHM=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
  let yangi;
  if(how==="miss")yangi={s:"missed",t:null};
  else if(how==="jamoat"&&!P.fard)return;
  /* Nafl namoz istalgan vaqtda o'qiladi va hech qachon minus bermaydi —
     u faqat qo'shadi, shuning uchun oyna ham, kun yopilgani ham to'smaydi. */
  else if(!P.fard)yangi={s:"ontime",t:tgt===live?nowHM:null};
  else if(tgt!==live)yangi={s:"late",t:null};
  else{
   const st=winState(pk,tgt,cfg);
   /* Farz namozning vaqti kirmagan bo'lsa belgilab bo'lmaydi. */
   if(st==="early")return;
   yangi={s:st==="open"?"ontime":"qazo",t:nowHM}}
  /* «Jamoat bilan» — bu ro'y bergan voqea, shuning uchun qazo bo'lsa ham
     yoziladi; qo'shimcha ball esa faqat vaqtida o'qilganiga beriladi. */
  if(how==="jamoat")yangi.j=true;
  /* Yozuv ortga qaytmagani uchun avval bir marta so'raymiz — noto'g'ri bosilgan
     tugma butun kunni buzib qo'ymasin. */
  const S=STATUS[yangi.s],nomi=!P.fard?"o'qildi":(S?S.label.toLowerCase():yangi.s);
  const qay=yangi.j?", jamoat bilan":"";
  if(!confirm(P.n+" — «"+nomi+qay+"» deb yoziladi"+(yangi.t?", soat "+yangi.t:"")
    +(tgt!==date?" ("+pretty(tgt)+")":"")
    +".\n\nBir marta belgilangandan keyin o'zgartirib bo'lmaydi."))return;
  day[pk]=yangi;
  data[me]=Object.assign({},data[me],{days:Object.assign({},data[me].days,{[tgt]:day})});
  render();await pushDay(me,tgt);render()},

  data[me]=Object.assign({},data[me],{books:((data[me].books)||[]).map(b=>
   b.id===bid?Object.assign({},b,{notes:(b.notes||[]).filter(x=>x.id!==nid)}):b)});

 async bookFinish(id){
  const ds=todayFor(myCfg());

   b.id===id?Object.assign({},b,{finished:b.finished?null:ds}):b)});

 async bookDel(id){
  if(!confirm("Kitob va undagi barcha zametkalar o'chiriladi. Davom etamizmi?"))return;
  data[me]=Object.assign({},data[me],{books:((data[me].books)||[]).filter(b=>b.id!==id)});

 toggleManual(){manualCity=!manualCity;render()},
 /* ────────── SAFAR: HOZIR QAYSI SHAHARDA ────────── */
 togglePlaceManual(){manualPlace=!manualPlace;placeMsg="";render()},
 async setPlace(){
  const cur=myCfg(),g=id=>((document.getElementById(id)||{}).value||"");
  const asr=parseInt(g("pl_asr"),10)||cur.asr;
  const tzv=parseFloat(g("pl_tz"));
  /* Server tz uchun −12..14 oralig'ini talab qiladi; noto'g'ri qiymat bilan
     yozuv mahalliy saqlanib, keyin 422 bilan qaytib kelmasligi uchun shu yerda
     to'xtatamiz. */
  if(!isNaN(tzv)&&(tzv<-12||tzv>14)){
   placeMsg="Vaqt mintaqasi −12 va 14 orasida bo'lishi kerak";render();return}
  let pl;
  if(manualPlace){
   const city=g("pl_city").trim(),lat=parseFloat(g("pl_lat")),lng=parseFloat(g("pl_lng"));
   if(!city||isNaN(lat)||isNaN(lng)||isNaN(tzv)){
    placeMsg="Shahar nomi, koordinatalar va vaqt mintaqasini to'ldiring";render();return}
   if(lat<-90||lat>90||lng<-180||lng>180){
    placeMsg="Kenglik −90..90, uzunlik −180..180 orasida bo'lsin";render();return}
   pl={city:city.slice(0,64),lat:lat,lng:lng,tz:tzv,asr:asr,fa:18,ia:18};
  }else{
   const c=CITIES[parseInt(g("pl_sel"),10)]||CITIES[0];
   pl={city:c.n,lat:c.lat,lng:c.lng,tz:isNaN(tzv)?c.tz:tzv,asr:asr,fa:c.fa,ia:c.ia};
  }
  /* Sana YANGI shahar vaqtida olinadi: mintaqa o'zgarishi bilan «bugun» ham
     o'zgarishi mumkin, yozuv esa a'zo yetib borgan kunga tegishli. */
  pl.d=todayFor(Object.assign({},cur,pl));
  /* Bir kunga bitta shahar — o'sha kunga avval yozilgani almashtiriladi. */
  const rest=((data[me].places)||[]).filter(x=>x.d!==pl.d);
  data[me]=Object.assign({},data[me],
    {places:rest.concat([pl]).sort((a,b)=>a.d<b.d?-1:1)});
  placeMsg=pl.city+" belgilandi — namoz vaqtlari shu shahar bo'yicha hisoblanadi";
  date=todayFor(myCfg());
  render();await pushData(me);render()},
 async delPlace(d){
  data[me]=Object.assign({},data[me],
    {places:((data[me].places)||[]).filter(x=>x.d!==d)});
  placeMsg="";date=todayFor(myCfg());render();await pushData(me);render()},
 async addMember(){
  const err=document.getElementById("f_err");
  const name=document.getElementById("f_name").value.trim();
  if(!circleId){err.textContent="Doira tanlanmagan";return}
  if(!name){err.textContent="Ism kiriting";return}
  let city,lat,lng,fa=18,ia=18;
  if(manualCity){
   city=document.getElementById("f_city").value.trim();
   lat=parseFloat(document.getElementById("f_lat").value);
   lng=parseFloat(document.getElementById("f_lng").value);
   if(!city||isNaN(lat)||isNaN(lng)){err.textContent="Shahar va koordinatalarni to'ldiring";return}
   if(Math.abs(lat)>66){err.textContent="Kenglik ±66 dan oshmasin";return}
  }else{const c=CITIES[+document.getElementById("f_sel").value];city=c.n;lat=c.lat;lng=c.lng;fa=c.fa;ia=c.ia}
  const tz=parseFloat(document.getElementById("f_tz").value);
  const asr=+document.querySelector("[name=f_asr]:checked").value;
  const pin=document.getElementById("f_pin").value.trim();
  if(!/^[0-9]{4}$/.test(pin)){err.textContent="PIN 4 ta raqam bo'lsin";return}
  const yozilgan=(document.getElementById("f_id").value||"").trim().toLowerCase();
  const id=yozilgan||slugId(name);
  if(!/^[a-z0-9]{1,32}$/.test(id)){
   err.textContent="Login lotin harfi va raqamdan iborat bo'lsin";return}
  let javob;
  try{javob=await api("/circles/"+encodeURIComponent(circleId)+"/members",{method:"POST",
    body:JSON.stringify({new_member:{id:id,name:name,city:city,lat:lat,lng:lng,
      tz:tz,asr:asr,fa:fa,ia:ia,pin:pin}})})}
  catch(e){err.textContent=e.message||"Qo'shib bo'lmadi";return}
  /* Login band bo'lsa server bo'shini o'zi tanlaydi, shuning uchun javobdan
     o'qiymiz — yuborganimizdan emas. Bu ikkisi har doim ham bir xil emas. */
  alert("Qo'shildi.\n\nLogin: "+javob.member.id+"\nPIN: "+javob.pin+
    "\n\nShu ikkisini odamga ayting.");
  screen="sync";await A.loadRoster();await pull();render()},
 exportJSON(){
  const blob=new Blob([JSON.stringify({members:members,data:data},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="namoz-daftari-"+today()+".json";a.click()},
 importJSON(inp){
  const f=inp.files[0];if(!f)return;const fr=new FileReader();
  fr.onload=async()=>{try{const j=JSON.parse(fr.result);
   if(j.members)members=j.members;if(j.data)data=j.data;
   members.forEach(m=>{if(!data[m.id])data[m.id]=blank()});
   await pushMembers();if(me)await pushData(me);
   alert("Yuklandi");render()}catch(e){alert("Fayl noto'g'ri")}};
  fr.readAsText(f)}
};

/* Ismdan login: "Zuhra Ismoilova" → "zuhra". O'zbekcha apostroflar (o', g', \u02bb)
   tushib qoladi, chunki login faqat lotin harfi va raqamdan iborat bo'ladi. */
function slugId(name){
 const bosh=String(name||"").trim().split(/\s+/)[0]||"";
 return bosh.toLowerCase()
  .replace(/[\u02bb\u02bc\u2018\u2019']/g,"")
  .replace(/[^a-z0-9]/g,"").slice(0,12)}

   ko'rinmaydi: ular har xil shaharda, bir xonada o'qiy olmaydi. */
function curCircle(){return (circles||[]).find(c=>c.id===circleId)||null}
function isFamily(){const c=curCircle();return !!c&&c.kind==="family"}
function isChild(id){const m=(members||[]).find(x=>x.id===id);return !!(m&&m.is_child)}

function ownsCircle(list,id){
 const found=(list||[]).find(c=>c.id===id);
 return !!found&&found.owner_id===me}

/* ══════════════ UYDA JAMOAT ══════════════ */
/* Chaqiruv faqat "birga o'qiymiz" degan xabar. Hech kimning namozi yozilmaydi:
   har kim o'zi belgilaydi, shuning uchun "birov uchun belgilamaydi" va "belgilangani
   o'zgarmaydi" qoidalari buzilmaydi. */
function activeCalls(cfg){
 if(!isFamily())return [];
 return (calls||[]).filter(c=>{
  const p=PRAYERS.find(x=>x.k===c.prayer);
  return !!p&&p.fard&&c.day===liveDay(c.prayer,cfg)&&winState(c.prayer,c.day,cfg)==="open"})}
function calledFor(pk,ds){return (calls||[]).some(c=>c.prayer===pk&&c.day===ds)}
function jamoatBanner(cfg){
 return activeCalls(cfg).map(c=>{
  const p=PRAYERS.find(x=>x.k===c.prayer)||{n:c.prayer};
  const kim=(members.find(x=>x.id===c.caller_id)||{}).name||c.caller_id;
  const belgilangan=((data[me].days||{})[c.day]||{})[c.prayer];
  return `<div class="panel p14 mb14" style="border-color:#4CAF8B66">
   <div class="flex center gap3">
    <div style="font-size:26px">\u{1F54C}</div>
    <div style="flex:1;min-width:0">
     <div style="font-family:var(--serif);font-size:17px">${
       c.caller_id===me?"Siz":esc(first(kim))} ${esc(p.n)} namoziga chaqirdi${
       c.caller_id===me?"ngiz":""}</div>
     <p class="muted small" style="margin:4px 0 0;line-height:1.6">${belgilangan
       ?"Siz belgilab bo'ldingiz."
       :"Birga o'qigach, "+esc(p.n)+" qatoridagi \u{1F54C} tugmasini o'zingiz bosing."}</p>
    </div></div></div>`}).join("")}

/* Shu tezlikda qazo qachon tugaydi, kunlarda. Kitob tezligi kabi hisoblanadi:
   birinchi qazo yozilgan kundan beri o'tgan HAR BIR kunga bo'linadi, faqat qazo
   o'qilgan kunlarga emas — tashlab qo'yilgan kunlar ham muddatni uzaytiradi. */
function qazoPace(u,qarz,td){
 const days=(u&&u.days)||{};
 const kunlar=Object.keys(days).filter(d=>qazoOf(days[d])>0).sort();
 if(!kunlar.length)return null;
 const jami=kunlar.reduce((n,d)=>n+qazoOf(days[d]),0);
 const qolgan=Math.max(0,qarz-jami);
 if(!qolgan)return null;
 const kun=Math.max(1,daysBetween(kunlar[0],td)+1),tezlik=jami/kun;
 if(tezlik<=0)return null;
 return Math.ceil(qolgan/tezlik)}
const qazoMuddat=kun=>{
 if(kun<=45)return kun+" kun";
 const oy=Math.round(kun/30.44);
 if(oy<18)return oy+" oy";
 const yil=Math.floor(oy/12),qoloy=oy%12;
 return yil+" yil"+(qoloy?" "+qoloy+" oy":"")};

/* ────────── QAZO DAFTARI ────────── */
/* Yillar oldin qolib ketgan namozlarni uzish. Bugungi kechikkan namoz emas —
   uni «Qazo» deb ataydigan yagona joy namoz kartasidagi holat, bu esa butunlay
   boshqa daftar, shuning uchun nomi ham, rangi ham boshqa. */
function qazoPanel(day,isT){
 /* Bolada qarz yo'q, demak uzadigan qazo ham yo'q. */
 if(isChild(me))return "";
 const u=data[me]||blank(),td=todayFor(myCfg());
 /* Qarz odamning o'zida turadi, hujjatida emas: hujjat serverda beshta jadvalga
    yoyib yoziladi va o'z jadvali yo'q maydon har safar nolga qaytib kelardi. */
 const qarz=(M(me)||{}).qazo_debt||0;
 const jami=Object.keys(u.days||{}).reduce((n,d)=>n+qazoOf(u.days[d]),0);
 const qolgan=Math.max(0,qarz-jami);
 const bugun=isT?QAZO_VAQT.reduce((n,k)=>n+A.qazoShown(k),0):qazoOf(day);
 const kutayotgan=isT&&QAZO_VAQT.some(k=>A.qazoShown(k)>A.qazoSaved(k));
 const pick=A.qazoPick,bor=isT?A.qazoShown(pick):0,saqlangan=isT?A.qazoSaved(pick):0;
 /* Bugun saqlangani: faqat nol bo'lmaganlari, bitta qatorda. */
 const yozilgan=QAZO_VAQT.filter(k=>((day.qazo||{})[k]||0)>0)
   .map(k=>PR(k)+" "+(day.qazo||{})[k]).join(" \u00B7 ");
 const tanlov=isT?`<select id="q_pick" class="input" onchange="A.setQazoPick(this.value)">${
   QAZO_VAQT.map(k=>`<option value="${k}"${k===pick?" selected":""}>${PR(k)}</option>`).join("")
  }</select>
  <div class="flex center gap3" style="margin-top:12px;justify-content:center">
   <button class="mbtn" style="${bor<=saqlangan?"opacity:.28;cursor:default":""}"${
     bor<=saqlangan?"":` onclick="A.subQazo()"`}>\u2212</button>
   <b style="font-family:var(--serif);font-size:30px;min-width:46px;text-align:center;color:${
     bor?"var(--brass)":"var(--mut)"}">${bor}</b>
   <button class="mbtn" onclick="A.addQazo()">+</button></div>
  <button class="btn-wide ${kutayotgan?"btn-green":"btn"}" style="margin-top:12px;${
    kutayotgan?"":"opacity:.45;cursor:default"}"${kutayotgan?' onclick="A.saveQazo()"':""}>Saqlash</button>`:"";
 /* Qarz — BOSHLANG'ICH son, qolgani emas. Qolgan har doim shundan o'qilganlar
    ayrilib chiqariladi, aks holda qolgan sonni qayta kiritgan odamning
    o'qiganlari ikki marta ayrilib ketardi. */
 const kun=qarz>0?qazoPace(u,qarz,td):null;
 const hisob=qarz>0
  ?`<div class="bar" style="margin-top:10px"><div style="width:${
     Math.min(100,Math.round(jami/qarz*100))}%;background:var(--jade)"></div></div>
    <div class="flex between center" style="margin-top:7px">
     <span class="muted small">${qarz} tadan ${jami} tasi o'qildi \u00B7 ${
       qolgan?qolgan+" qoldi":"hammasi uzildi"}</span>
     <button class="link" style="font-size:11px" onclick="A.editQazoDebt()">o'zgartirish</button></div>
    ${kun?`<div class="brass small" style="margin-top:5px">Shu tezlikda \u2248 ${
      qazoMuddat(kun)}da tugaydi</div>`:""}`
  :`<div style="margin-top:12px">
    <div class="muted small" style="margin-bottom:7px;line-height:1.6">Qazo qarzingiz taxminan
     qancha? Bir marta yozib qo'ysangiz, ilova qolganini va qachon tugashini o'zi sanab boradi.</div>
    <div class="flex gap2">
     <input id="q_debt" class="input" type="number" min="0" max="100000" placeholder="masalan 9125" style="flex:1">
     <button class="btn" onclick="A.setQazoDebt()">Saqlash</button></div></div>`;
 return `<div class="panel p14 mt14" style="border-color:${kutayotgan?"#C9A22766":"var(--line)"}">
  <div class="flex between center">
   <div><div style="font-family:var(--serif);font-size:16px">Qazo daftari</div>
    <div class="muted small">Yillar oldin qolib ketgan namozlar \u00B7 har biri +${fmt(QAZO_BALL)} ball</div></div>
   <div class="brass small">${bugun?"bugun: "+bugun+" ta":""}</div></div>
  ${tanlov}
  ${yozilgan?`<div class="muted tiny" style="margin-top:10px;padding-top:9px;border-top:1px solid var(--line)">
    ${isT?"Bugun saqlangan":pretty(date)}: ${yozilgan}</div>`:""}
  ${A.qazoMsg?`<div class="jade small" style="margin-top:7px">${esc(A.qazoMsg)}</div>`:""}
  ${hisob}</div>`}

/* ────────── BUGUN ────────── */
function todayTab(){
 const cfg=myCfg(),sc=daySchedule(new Date(date+"T12:00:00"),cfgAt(M(me),date));
 const isT=date===todayFor(cfg),now=nowFor(cfg),nowDec=decOf(now);
 const day=(data[me].days||{})[date]||{},s=score(data[me],cfg,isChild(me));
 /* Kun bali qatorning o'zi va'da qilgan narsani ko'rsatishi kerak: nafl "+0,25
    ball" deb turgan joyda tepadagi raqam qimirlamay qolsa, odam hisob ishlamayapti
    deb o'ylaydi. Jamoat bali bu yerda bor edi, nafl bali tushib qolgan edi. */
 /* Kun bali reytingning o'zidan olinadi — ikkinchi nusxa yozilsa, ular bir kun
    kelib ajralib ketadi. Aynan shu bo'lgan edi. */
 const dayBall=prayerRange(data[me],M(me),date,date).ball;
 let nx=null;
 if(isT){const list=PRAYERS.map(p=>({p:p,t:sc[p.k]})).sort((a,b)=>a.t-b.t);
  nx=list.find(x=>x.t>nowDec)||null;
  /* Xufton kirgandan keyin kun ichida boshqa vaqt qolmaydi — keyingisi ertangi bomdod. */
  if(!nx)nx={p:PRAYERS.find(p=>p.k==="bomdod"),t:sc.endXufton+24}}
 let h=`<div class="flex between center mb14">
  <button class="btn" onclick="A.setDate(-1)">‹</button>
  <div style="text-align:center">
   <div style="font-family:var(--serif);font-size:19px">${pretty(date)}</div>
   <div class="muted small" style="letter-spacing:.08em">${esc(cfg.city.toUpperCase())} · ${isT?"KUN OCHIQ":"KUN YOPILGAN"}</div>
  </div>
  <button class="btn" ${date>=todayFor(cfg)?'style="opacity:.3"':""} onclick="${date>=todayFor(cfg)?"":"A.setDate(1)"}">›</button>
 </div>
 <div class="grid2 mb14">
  <div class="panel stat"><b class="${dayBall<0?"clay":"jade"}">${
    dayBall===0?"0":(dayBall>0?"+":"")+fmt(dayBall)}</b><i>Shu kun bali</i></div>
  ${isChild(me)
   ?`<div class="panel stat"><b class="brass">\u2B50 ${s.stars}</b><i>Yulduzchalar</i></div>`
   :`<div class="panel stat"><b class="${s.debt>0?"clay":"jade"}">${fmt(s.debt)}</b><i>Shu oydagi qarz</i></div>`}
 </div>`;
 if(nx){const mm=Math.round((nx.t-nowDec)*60);
  h+=`<div class="panel p14 mb14 flex between center">
   <div><div class="eyebrow">Keyingi vaqt</div><div style="font-family:var(--serif);font-size:20px;margin-top:2px">${nx.p.n}</div></div>
   <div style="text-align:right"><div class="brass" style="font-family:var(--serif);font-size:26px">${hm(nx.t)}</div>
   <div class="muted small">${Math.floor(mm/60)} soat ${mm%60} daqiqa qoldi</div></div></div>`}
 if(isT)h+=jamoatBanner(cfg);
 PRAYERS.forEach(p=>{
  /* Ochiq kunda har bir namoz o'z kuniga bog'lanadi: xufton bomdodgacha
     kechagi kunning xuftoni bo'lib qolaveradi. */
  const tgt=isT?liveDay(p.k,cfg):date;
  const tsc=tgt===date?sc:daySchedule(new Date(tgt+"T12:00:00"),cfgAt(M(me),tgt));
  const st0=hm(tsc[p.k]),en=hm(tsc[EKY[p.k]]);
  const r=((data[me].days||{})[tgt]||{})[p.k];
  /* Ish rejimida uzilgan peshin/asr/shom kartada ham vaqtida bo'lib ko'rinadi —
     hisobda bir xil, ekranda boshqacha bo'lsa odam ikkalasiga ham ishonmaydi. */
  const st=holat(cfg,p.k,r),S0=r?STATUS[st]:null;
  const yengil=!!r&&st!==r.s;
  /* Ayollar rejimida kechikkan namoz holatini o'zgartirmaydi — faqat bali. */
  const ayolQazo=st==="qazo"&&ayolRejimi(cfg);
  const bal=belgiBall(cfg,p,r,st);
  const state=isT?winState(p.k,tgt,cfg):null;
  /* Nafl uchun oyna faqat tavsiya — belgilash hech qachon to'silmaydi. */
  const open=state==="open",notYet=p.fard&&state==="early",shifted=tgt!==date;
  /* Belgilangan namoz qulflanadi: tahrirlash ham, tozalash ham yo'q. */
  const locked=!!r;
  const crosses=p.k==="xufton";
  const dl=(r&&r.t&&(st==="ontime"||st==="qazo"))?diffMin(st0,r.t):null;
  /* Qulflangan qatorda tugmalar ko'rinadi-yu, bosilmaydi: tanlangani yorqin,
     tanlanmagani xira turadi. */
  const stCol=!r?"":st==="ontime"?"var(--jade)":st==="missed"?"var(--clay)":"var(--brass)";
  const onStyle=`background:${stCol};border-color:transparent;color:#0D1220`;
  const offStyle=locked?"opacity:.28;cursor:default":(notYet?"opacity:.35":"");
  const btn=(on,belgi,how,izoh)=>`<button class="mbtn" title="${izoh}" style="${on?onStyle:offStyle}"`
    +`${locked||notYet?"":` onclick="A.mark('${p.k}','${how}','${tgt}')"`}>${belgi}</button>`;
  h+=`<div class="panel p14 mb10" style="border-color:${S0?S0.color:(open?"#C9A22755":"var(--line)")}">
   <div class="flex center gap3">
    <div style="width:34px;height:34px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;
      justify-content:center;color:${open?"var(--brass)":"var(--mut)"};flex-shrink:0">${p.ic}</div>
    <div style="flex:1;min-width:0">
     <div class="flex center gap2"><span class="pname">${p.n}</span>
      ${!p.fard?'<span class="chip">NAFL</span>':""}
      ${open?'<span class="jade" style="font-size:9px">● VAQTI KIRDI</span>':""}</div>
     <div class="muted small">${st0} — ${en}${crosses?" <span class='tiny'>(ertangi bomdodgacha)</span>":""}${
       !p.fard?" <span class='jade tiny'>· istalgan vaqtda</span>":""}</div>
     ${shifted?`<div class="brass tiny" style="margin-top:2px">${pretty(tgt)} kunining xuftoni</div>`:""}
     ${isFamily()&&isT&&open&&p.fard?(calledFor(p.k,tgt)
       ?`<div class="jade tiny" style="margin-top:3px">\u{1F54C} uyda birga o'qiymiz deb chaqirilgan</div>`
       :`<button class="link" style="font-size:11px;margin-top:2px" onclick="A.callJamoat('${p.k}','${tgt}')">\u{1F54C} Uyda birga o'qiymiz</button>`):""}
    </div>
    ${p.fard?btn(!!(r&&r.j),"\u{1F54C}","jamoat","Jamoat bilan o'qidim"):""}
    ${btn(!!r&&!(r&&r.j)&&r.s!=="missed","\u2713","pray",p.fard?"Yolg'iz o'qidim":"O'qidim")}
    ${p.fard?btn((r&&r.s)==="missed","\u2212","miss","O'qimadim"):""}
   </div>`;
  if(r){
   if((st==="ontime"||st==="qazo")&&r.t){
    const tot=winLen(st0,en),raw=diffMin(st0,r.t)/tot,pos=Math.max(0,Math.min(1,raw));
    h+=`<div class="arc" style="margin-top:12px"><i style="left:calc(${pos*100}% - 3px);background:${raw>1?"var(--clay)":"var(--text)"}"></i></div>`}
   h+=`<div class="flex between center" style="margin-top:8px">
     <div style="font-size:12px;color:${!p.fard?"var(--jade)":S0.color}">${
       !p.fard?"O'qildi":S0.label}${yengil?" <span class='chip'>ISH REJIMI</span>":""}${
       ayolQazo?" <span class='chip'>AYOLLAR REJIMI</span>":""}${
       r.j?" \u{1F54C} jamoat":""} ·
       <span class="${bal<0?"clay":"jade"}">${bal>0?"+":""}${fmt(bal)} ball</span>
       ${dl!=null&&dl>=0&&st==="ontime"&&!yengil?" · +"+dl+" daq":""}</div>
     <div class="muted tiny">${r.t?esc(r.t)+" · ":""}\u{1F512} qulflangan</div></div>`;
  }else{
   h+=`<div class="muted" style="margin-top:10px;font-size:11.5px">${
    !p.fard?"Nafl — minus yo'q. Istalgan vaqtda o'qiysiz, har biri qarzni "+fmt(NAFL_BALL)+" ballga kamaytiradi"
    :notYet?"Vaqti kirmagan — vaqti kirgach belgilanadi"
    :open?"Vaqti ichida — hozir belgilasangiz 0 ball"
    :isT?"Vaqti o'tdi — bugun qazo qilsangiz −0,25, ertaga qolsa −1"
    :"Belgilanmagan — o'tkazib yuborilgan hisoblanadi (−1)"}</div>`}
  h+=`</div>`});
 h+=qazoPanel(day,isT);
 h+=`<div class="panel p14 mt14 flex between center">
   <div><div style="font-family:var(--serif);font-size:16px">Bugun Qur'on o'qidim</div>
   <div class="muted small">Oz bo'lsa ham — davomiysi afzal</div></div>
   <button class="mbtn" style="${day.quran?"background:var(--jade);border-color:transparent;color:#0D1220":""}"
     onclick="A.field('quran',${day.quran?"false":"true"})">✓</button></div>`;
 return h}

/* ══════════════ OILAVIY NAMOZ TAHLILI ══════════════ */
/* Do'stlar doirasidan olib tashlangan edi — hech kim o'qimasdi. Oilada esa
   ota-onaga haqiqiy ma'lumot beradi: qaysi namoz qoldirilyapti, kim qancha
   kechikyapti. Shuning uchun faqat oila turidagi doirada ko'rinadi. */
function oilaTahlil(kunlar){
 const td=todayFor(myCfg()),bosh=shift(td,-(kunlar-1));
 const jami={},kishi=[];
 PRAYERS.filter(p=>p.fard).forEach(p=>jami[p.k]={bad:0,qazo:0});
 members.forEach(m=>{
  const u=data[m.id]||blank(),days=u.days||{};
  const boshi=Object.keys(days).sort()[0];
  const per={},kech={sum:0,n:0};
  PRAYERS.filter(p=>p.fard).forEach(p=>per[p.k]={ontime:0,qazo:0,bad:0});
  if(boshi){
   const openX=liveDay("xufton",cfgNow(m));
   for(let d=bosh<boshi?boshi:bosh,i=0;i<40&&d<=td;i++,d=shift(d,1)){
    const day=days[d]||{},closed=d<td;
    const sc=daySchedule(new Date(d+"T12:00:00"),cfgAt(m,d));
    PRAYERS.filter(p=>p.fard).forEach(p=>{
     const r=day[p.k],shut=closed&&!(p.k==="xufton"&&d===openX);
     const st=holat(cfgNow(m),p.k,r);
     if(!r){if(shut){per[p.k].bad++;jami[p.k].bad++}return}
     if(st==="ontime"){per[p.k].ontime++;
      if(r.t&&r.s==="ontime"){const dq=diffMin(hm(sc[p.k]),r.t);if(dq>=0&&dq<600){kech.sum+=dq;kech.n++}}}
     else if(st==="qazo"){per[p.k].qazo++;jami[p.k].qazo++}
     else{per[p.k].bad++;jami[p.k].bad++}})}}
  let ogir=null;
  PRAYERS.filter(p=>p.fard).forEach(p=>{

 let engOgir=null;
 PRAYERS.filter(p=>p.fard).forEach(p=>{

/* Kim qaysi qazo namozlarini uzayotgani. Ataylab tartiblanmaydi va taqqoslanmaydi:
   eski qazo — har kimning o'z hisobi, poyga emas. Shuning uchun o'rin ham, foiz ham
   yo'q, faqat kim nimani uzayotgani ko'rinib turadi. */
function qazoJamoaView(){
 const kimdir=members.some(m=>{
  const u=data[m.id]||blank();
  return Object.keys(u.days||{}).some(d=>qazoOf(u.days[d])>0)});
 if(!kimdir)return "";
 let h=`<div class="panel p14 mb14"><div class="eyebrow">Qazo daftari · jamoa</div>
  <p class="muted small" style="margin:7px 0 12px;line-height:1.6">Kim qaysi eski qazo
   namozlarini uzayotgani. Bu poyga emas — o'rin ham, taqqoslash ham yo'q.</p>`;
 members.forEach(m=>{
  const u=data[m.id]||blank(),days=u.days||{};
  const per={};QAZO_VAQT.forEach(k=>per[k]=0);
  Object.keys(days).forEach(d=>{const q=(days[d]||{}).qazo||{};
   QAZO_VAQT.forEach(k=>per[k]+=q[k]||0)});
  const jami=QAZO_VAQT.reduce((n,k)=>n+per[k],0);
  const satr=QAZO_VAQT.filter(k=>per[k]>0).map(k=>PR(k)+" "+per[k]).join(" \u00B7 ");
  h+=`<div style="padding:8px 0;border-top:1px solid var(--line)">
   <div class="flex between center">
    <span style="font-size:12.5px;color:${colorOf(m.id)}">${esc(first(m.name))}</span>
    <span class="${jami?"jade":"muted"} small">${jami?jami+" ta":"hali boshlanmagan"}</span></div>
   ${satr?`<div class="muted tiny" style="margin-top:3px">${satr}</div>`:""}</div>`});
 return h+`</div>`}
