   bosib o'zingizga pora oling.</p>`;
 const qolgan=30-Object.keys(olingan).length;
 h+=`<div class="muted tiny" style="margin-top:11px">${qolgan} pora hali egasiz${
   khatm.started?" \u00b7 "+pretty(khatm.started)+" da boshlandi":""}</div></div>`;
 return h}

function bookSwitch(){
 const on="background:var(--brass);color:#0D1220;border-color:transparent;font-weight:600";
 return `<div class="flex gap2 mb14">
  <button class="btn" style="flex:1;${A.bookView!=="all"?on:""}" onclick="A.setBookView('mine')">Mening kitoblarim</button>
  <button class="btn" style="flex:1;${A.bookView==="all"?on:""}" onclick="A.setBookView('all')">Umumiy daftar</button>
 </div>`}

function noteBubble(m,b,n,own){
 return `<div class="panel p14 mb10" style="border-left:2px solid ${colorOf(m.id)}">
  <div class="flex between center" style="margin-bottom:6px">
   <div style="font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:${colorOf(m.id)}">${esc(first(m.name))}</div>
   <div class="muted tiny">${esc(n.d)}${n.t?" · "+esc(n.t):""}</div></div>
  <div class="muted tiny" style="margin-bottom:7px">\u{1F4D6} ${esc(b.title)}${n.page!=null?" · "+n.page+"-bet":""}</div>
  <div style="font-size:13.5px;line-height:1.7;white-space:pre-wrap">${esc(n.text)}</div>
  ${own?`<div style="text-align:right;margin-top:8px">
    <button class="btn" style="padding:3px 8px;font-size:11px" onclick="A.bookNoteDel('${b.id}','${n.id}')">o'chirish</button></div>`:""}
 </div>`}

function bookCard(b,td){
 const pc=bookPace(b,td),ds=todayFor(myCfg());
 const bugun=(b.log||[]).find(e=>e.d===ds),open=A.bookOpenId===b.id;
 const notes=(b.notes||[]).slice().reverse();
 let h=`<div class="panel p14 mb10" style="border-color:${b.finished?"#4CAF8B55":"var(--line)"}">
  <div class="flex between center" style="cursor:pointer" onclick="A.toggleBook('${b.id}')">
   <div style="flex:1;min-width:0">
    <div style="font-family:var(--serif);font-size:18px;line-height:1.25">${esc(b.title)}</div>
    <div class="muted small" style="margin-top:3px">${esc(b.author||"muallif ko'rsatilmagan")}</div>
   </div>
   <div style="text-align:right;flex-shrink:0;margin-left:10px">
    <div class="${b.finished?"jade":"brass"}" style="font-family:var(--serif);font-size:22px">${pc.foiz}%</div>
    <div class="muted tiny">${pc.read} / ${b.pages} bet</div></div>
  </div>
  <div class="bar" style="margin-top:10px"><div style="width:${pc.foiz}%;background:${b.finished?"var(--jade)":"var(--brass)"}"></div></div>`;
 if(b.finished){
  h+=`<div class="jade small" style="margin-top:9px">\u2713 ${esc(b.finished)} kuni tugatilgan · ${pc.kun} kunda · kuniga ${fmt(pc.tezlik)} bet</div>`;
 }else{
  h+=`<div class="muted small" style="margin-top:9px;line-height:1.6">
    Kuniga <span class="brass">${fmt(pc.tezlik)} bet</span> · ${pc.qoldi} bet qoldi${
    pc.qoldi<=0?" · <span class='jade'>o'qib bo'lindi</span>"
    :pc.kunQoldi==null?" · <span class='clay'>hali boshlanmagan</span>"
    :` · shu tezlikda yana <span class="brass">${pc.kunQoldi} kun</span>${pc.tugash?" ("+pretty(pc.tugash)+")":""}`}</div>
   <div class="flex gap2 center" style="margin-top:11px">
    <span class="muted small" style="flex:1">Bugun o'qidim</span>
    <input class="input" type="number" min="0" inputmode="numeric" style="width:84px;padding:6px 8px;font-size:13px"
      value="${bugun?bugun.p:""}" placeholder="bet" onchange="A.bookPages('${b.id}',this.value)">
    <span class="${bugun&&bugun.p>=BET_NORMA?"jade":"muted"} tiny">norma ${BET_NORMA}</span>
   </div>`}
 if(open){
  h+=`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
   <div class="eyebrow">Zametka — kitobdan olganingiz</div>
   <p class="muted small" style="margin:6px 0 8px">Bitta fikr, bitta xabar. Hammaga ko'rinadi.</p>
   <textarea id="n_${b.id}" rows="3" placeholder="Masalan: sabr — bu kutish emas, kutayotganda qanday bo'lishing…"></textarea>
   <div class="flex gap2" style="margin-top:8px">
    <input id="np_${b.id}" class="input" type="number" min="0" inputmode="numeric" placeholder="bet" style="width:84px">
    <button class="btn btn-gold" style="flex:1" onclick="A.bookNote('${b.id}')">Zametka qo'shish</button></div>
   ${A.bookErr?`<div class="clay small" style="margin-top:7px">${esc(A.bookErr)}</div>`:""}
   <div style="margin-top:14px">${notes.length?notes.map(n=>noteBubble(myCfg(),b,n,true)).join("")
     :`<div class="muted small">Hali zametka yo'q.</div>`}</div>
   <div class="flex gap2" style="margin-top:12px">
    <button class="btn" style="flex:1" onclick="A.bookFinish('${b.id}')">${b.finished?"↺ Qayta ochish":"\u2713 Tugatdim"}</button>
    <button class="btn" onclick="A.bookDel('${b.id}')">\u{1F5D1}</button></div>
  </div>`}
 else h+=`<div class="muted tiny" style="margin-top:9px">${(b.notes||[]).length} ta zametka · ochish uchun bosing</div>`;
 return h+`</div>`}

function booksMineView(){
 const cfg=myCfg(),td=todayFor(cfg),u=data[me],bs=(u.books||[]).slice();
 const k=bookScore(u,cfg),jazo=Math.max(0,Math.floor(k.debt/K_TASK_AT));
 bs.sort((a,b)=>(a.finished?1:0)-(b.finished?1:0)||(a.started<b.started?1:-1));
 let h=`<div class="eyebrow">Kitob daftari</div>
 <h2 style="font-size:24px;margin:6px 0 12px">O'qiyotganlarim</h2>`+bookSwitch();
 h+=`<div class="grid3 mb14">
  <div class="panel stat"><b class="brass">${k.bet}</b><i>Jami bet</i></div>
  <div class="panel stat"><b class="brass">${k.notes}</b><i>Zametka</i></div>
  <div class="panel stat"><b class="${k.debt>0?"clay":"jade"}">${k.debt>0?"−"+fmt(k.debt):"+"+fmt(-k.debt)}</b><i>${k.debt>0?"Kitob qarzi":"Zaxira"}</i></div>
 </div>
 <div class="panel p14 mb14"><div class="muted" style="font-size:12px;line-height:1.75">
  <div><span class="jade">Kuniga ${BET_NORMA} bet va undan ko'p</span> — 0 ball</div>
  <div><span class="brass">Kam o'qilgan kun</span> — −${fmt(K_KAM)}</div>
  <div><span class="clay">Umuman o'qilmagan kun</span> — −${fmt(K_NOL)}</div>
  <div><span class="jade">Har bir zametka</span> — +${fmt(K_NOTE)} · <span class="jade">tugatilgan kitob</span> — +${K_DONE}</div>
  <div class="tiny" style="margin-top:6px">Kitob bali namoz balidan alohida yuritiladi.</div>
 </div></div>`;
 if(k.streak>0)h+=`<div class="panel p14 mb14 flex between center" style="border-color:#C9A22744">
   <div><div class="eyebrow">Ketma-ket normani bajardingiz</div>
    <div class="muted small" style="margin-top:3px">Uzmang — tezlik shundan chiqadi</div></div>
   <div class="brass" style="font-family:var(--serif);font-size:26px">${k.streak} kun</div></div>`;
 if(jazo>0)h+=`<div class="panel p18 mb14" style="border-color:#C9584B66">
   <div class="clay" style="font-family:var(--serif);font-size:20px">Jazo vazifasi</div>
   <p class="muted" style="font-size:12.5px;margin:6px 0 0;line-height:1.7">Kitob qarzi ${fmt(k.debt)} ball.
    <b>${jazo} ta</b> qo'shimcha vazifa ochiq — har biri <b>${K_TASK_BET} bet</b> o'qish va
    <b>1 ta zametka</b> yozish. Zametka yozganingizda qarz ${fmt(K_NOTE)} ballga kamayadi,
    kitobni tugatsangiz ${K_DONE} ballga.</p>
   <div class="muted tiny" style="margin-top:8px">O'qilmagan kunlar: ${k.nol} · kam o'qilgan: ${k.kam} · norma bajarilgan: ${k.toliq}</div></div>`;
 h+=`<div class="panel p14 mb14"><div class="eyebrow">Yangi kitob</div>
  <input id="b_title" class="input" placeholder="Kitob nomi" style="margin-top:9px">
  <input id="b_author" class="input" placeholder="Muallif" style="margin-top:8px">
  <input id="b_pages" class="input" type="number" min="1" inputmode="numeric" placeholder="Necha bet" style="margin-top:8px">
  ${A.bookErr&&!A.bookOpenId?`<div class="clay small" style="margin-top:8px">${esc(A.bookErr)}</div>`:""}
  <button class="btn btn-green btn-wide" style="margin-top:10px" onclick="A.bookAdd()">Qo'shish</button></div>`;
 h+=bs.length?bs.map(b=>bookCard(b,td)).join("")
  :`<div class="panel" style="padding:26px;text-align:center">
    <div style="font-size:26px">\u{1F4DA}</div>
    <div style="font-family:var(--serif);font-size:19px;margin-top:6px">Kitob qo'shilmagan</div>
    <p class="muted" style="font-size:13px;margin-top:6px">Birinchi kitobingizni qo'shing — hisob shundan boshlanadi.</p></div>`;
 return h}

function booksAllView(){
 const td=todayFor(myCfg());
 let h=`<div class="eyebrow">Jamoa</div>
 <h2 style="font-size:24px;margin:6px 0 12px">Umumiy kitob daftari</h2>`+bookSwitch();
 h+=`<div class="panel p14 mb14"><div class="eyebrow">Kim nima o'qiyapti</div><div class="mt12">`;
 let bor=false;
 members.forEach(m=>{
  const bs=((data[m.id]&&data[m.id].books)||[]).filter(b=>!b.finished);
  const k=bookScore(data[m.id],cfgNow(m));
  h+=`<div style="padding:9px 0;border-bottom:1px solid var(--line)">
   <div class="flex between center" style="margin-bottom:5px">
    <span style="font-size:12.5px;color:${colorOf(m.id)}">${esc(first(m.name))}</span>
    <span class="muted tiny">${k.bet} bet · ${k.notes} zametka · ${k.done} tugatgan ·
     <span class="${k.debt>0?"clay":"jade"}">${k.debt>0?"−"+fmt(k.debt):"+"+fmt(-k.debt)}</span></span></div>`;
  if(bs.length){bor=true;bs.forEach(b=>{const pc=bookPace(b,td);
   h+=`<div style="margin-bottom:6px">
    <div class="flex between tiny" style="margin-bottom:3px">
     <span>${esc(b.title)}${b.author?" <span class='muted'>· "+esc(b.author)+"</span>":""}</span>
     <span class="muted">${pc.read}/${b.pages}${pc.kunQoldi?" · "+pc.kunQoldi+" kun":""}</span></div>
    <div class="bar"><div style="width:${pc.foiz}%;background:${colorOf(m.id)}"></div></div></div>`})}
  else h+=`<div class="muted tiny">Hozir ochiq kitobi yo'q.</div>`;
  h+=`</div>`});
 h+=`</div></div>`;
 /* Kitob reytingi shu yerda turadi — Statistika faqat namoz bo'yicha. */
 const wk=weekRange(td),kr=rankBy(wk[0],wk[1],"kitob");
 const MED=["\u{1F947}","\u{1F948}","\u{1F949}"];
 h+=`<div class="panel p14 mb14"><div class="eyebrow">Bu hafta ko'p o'qiganlar</div>
  <div class="muted tiny" style="margin:4px 0 10px">${pretty(wk[0])} — ${pretty(wk[1])}</div>`;
 kr.forEach((x,i)=>{
  h+=`<div class="flex between center" style="padding:7px 0;border-top:1px solid var(--line)">
   <span class="flex center gap2" style="min-width:0">
    <span style="width:22px;flex-shrink:0">${MED[i]||(i+1)+"."}</span>
    <span style="font-size:13px;color:${colorOf(x.m.id)}">${esc(first(x.m.name))}</span></span>
   <span class="muted tiny">${x.o.bet} bet · ${x.o.notes} zametka
    <span class="${x.ball>0?"jade":"muted"}" style="font-family:var(--serif);font-size:15px;margin-left:5px">${fmt(x.ball)}</span></span>
  </div>`});
 h+=`</div>`;
 const feed=allNotes();
 h+=`<div class="eyebrow" style="margin-bottom:4px">Zametkalar · eng yangisi tepada</div>
  <p class="muted small" style="margin:0 0 12px">Bir-biringiz o'qiyotgan kitoblardan olgan fikrlar.</p>`;
 h+=feed.length?feed.map(x=>noteBubble(x.m,x.b,x.n,x.m.id===me)).join("")
  :`<div class="panel" style="padding:26px;text-align:center">
    <div style="font-size:26px">\u{1F4AC}</div>
    <div style="font-family:var(--serif);font-size:18px;margin-top:6px">Hali zametka yo'q</div>
    <p class="muted" style="font-size:13px;margin-top:6px">Birinchi bo'lib fikringizni yozing.</p></div>`;
 return h+`<div style="height:20px"></div>`}

/* ────────── NISHONLAR ────────── */
function nishonTab(){
 const cfg=myCfg(),wk=weekRange(todayFor(cfg));
 const jh=jamoaHafta(wk[0],wk[1]),tarix=jamoaTarix(cfg);
 const kim=(A.nishonKim&&M(A.nishonKim))?A.nishonKim:me;
 const t=nishonStat(M(kim));
 const olingan=NISHONLAR.filter(x=>x.v(t)>=x.kerak);
 const qolgan=NISHONLAR.filter(x=>x.v(t)<x.kerak)
   .sort((a,b)=>(b.v(t)/b.kerak)-(a.v(t)/a.kerak));

 let h=`<div class="eyebrow">Jamoa</div>
 <h2 style="font-size:24px;margin:6px 0 12px">Haftalik nishon</h2>
 <div class="panel p18 mb14" style="border-color:${jh.ok?"#4CAF8B66":"#C9A22744"}">
  <div class="flex center gap3">
   <div style="flex:1;min-width:0">
    <div style="font-family:var(--serif);font-size:19px" class="${jh.ok?"jade":""}">${
      jh.ok?"Nishon olindi":"Hammamiz uchun"}</div>
    <p class="muted small" style="margin:5px 0 0;line-height:1.65">Har bir a'zo shu hafta
     ${weekGoal()} ta namozni vaqtida o'qisa, nishonni hammamiz olamiz.
     Bittamiz yetmasa — hech kim olmaydi.</p></div>
   <div style="font-size:36px;${jh.ok?"":"opacity:.22;filter:grayscale(1)"}">\u{1F91D}</div>
  </div>
  <div style="margin-top:14px">`;
 jh.rows.forEach(x=>{
  const pct=Math.min(100,Math.round(x.ontime/weekGoal()*100));
  h+=`<div style="margin-bottom:10px">
   <div class="flex between tiny" style="margin-bottom:4px">
    <span style="color:${colorOf(x.m.id)}">${esc(first(x.m.name))}${x.ok?" \u2713":""}</span>
    <span class="${x.ok?"jade":"muted"}">${x.ontime} / ${weekGoal()}</span></div>
   <div class="bar"><div style="width:${pct}%;background:${x.ok?"var(--jade)":"var(--brass)"}"></div></div>
  </div>`});
 if(jh.bolalar&&jh.bolalar.length){
  h+=`<div style="margin-top:4px;padding-top:9px;border-top:1px solid var(--line)">
   <div class="muted tiny" style="margin-bottom:6px">Bolalar nishonni to'smaydi — yulduzchalari:</div>`;
  jh.bolalar.forEach(b=>{h+=`<div class="flex between tiny" style="margin-bottom:3px">
    <span style="color:${colorOf(b.m.id)}">${esc(first(b.m.name))}</span>
    <span class="brass">${"\u2B50"} ${b.stars}</span></div>`});
  h+=`</div>`}
 h+=`</div><div class="muted tiny">${pretty(wk[0])} — ${pretty(wk[1])} · jami olingan: ${tarix} hafta</div></div>`;
 h+=haftaTopshiriqView(wk);

 h+=`<div class="flex gap2 mb14" style="flex-wrap:wrap">`;
 members.forEach(m=>{
  h+=`<button class="btn" style="${m.id===kim
    ?"background:var(--brass);color:#0D1220;border-color:transparent;font-weight:600":""}"
    onclick="A.setNishonKim('${m.id}')">${esc(first(m.name))}</button>`});
 h+=`</div>`;

 h+=`<div class="flex between center mb10">
   <div class="eyebrow">Olingan nishonlar</div>
   <span class="brass small">${olingan.length} / ${NISHONLAR.length}</span></div>`;
 if(olingan.length){
  h+=`<div class="mb14" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:9px">`;
  olingan.forEach(x=>{
   h+=`<div class="panel" style="padding:12px 7px;text-align:center;border-color:#C9A22755">
    <div style="font-size:25px;line-height:1">${x.ic}</div>
    <div style="font-family:var(--serif);font-size:12px;margin-top:6px;line-height:1.3">${esc(x.n)}</div></div>`});
  h+=`</div>`;
 }else h+=`<div class="panel p14 mb14"><p class="muted small" style="margin:0">
   Hali nishon yo'q. Birinchisi bir marta namozni vaqtida belgilash bilan ochiladi.</p></div>`;

 h+=`<div class="eyebrow" style="margin-bottom:10px">Hali olinmagan</div>`;
 qolgan.forEach(x=>{
  const val=x.v(t),pct=Math.min(100,Math.round(val/x.kerak*100));
  h+=`<div class="panel p14 mb10">
   <div class="flex center gap3">
    <div style="font-size:21px;opacity:.28;filter:grayscale(1);flex-shrink:0">${x.ic}</div>
    <div style="flex:1;min-width:0">
     <div style="font-size:13.5px">${esc(x.n)}</div>
     <div class="muted tiny" style="margin-top:2px">${esc(x.d)}</div></div>
    <div class="muted small" style="flex-shrink:0">${val} / ${x.kerak}</div></div>
   <div class="bar" style="margin-top:9px"><div style="width:${pct}%;background:var(--brass)"></div></div>
  </div>`});
 return h+`<div style="height:16px"></div>`}

/* Doira almashtirgichi. Bitta doira bo'lsa ko'rsatilmaydi — tanlanadigan narsa
   yo'q joyda tugma qatori shovqindan boshqa narsa emas. */
function circleSwitcher(list){
 if(!list||list.length<2)return "";
 const on="background:var(--brass);color:#0D1220;border-color:transparent;font-weight:600";
 return `<div class="flex gap2 mb14" style="flex-wrap:wrap">`+list.map(c=>
   `<button class="btn" style="${c.id===circleId?on:""}"
     onclick="A.setCircle(${c.id})">${esc(c.name)}</button>`).join("")+`</div>`}

/* ────────── RENDER ────────── */
function render(){
 const app=document.getElementById("app");
 const y=window.scrollY;
 if(!loggedIn()||screen==="login"){app.innerHTML=loginScreen();return}
 if(screen==="add"){app.innerHTML=addScreen();return}
 if(screen==="admin"){app.innerHTML=adminScreen();return}
 if(screen==="sync"){app.innerHTML=syncScreen();return}
 /* Doirasi yo'q yoki ma'lumoti kelmagan a'zo: ilgari bunday holat bo'lmasdi,
    endi bo'lishi mumkin. Chizishga urinsak render qulab, ekran butunlay oq
    qoladi — na xabar, na chiqish tugmasi. Shuning uchun aniq to'xtatamiz. */
 if(!me||!members.some(x=>x.id===me)||!data[me]){
  app.innerHTML=`<div style="max-width:420px;margin:0 auto;padding-top:40px">
   <div class="eyebrow">Namoz Daftari</div>
   <h1 style="font-size:26px;margin:10px 0 8px">Doira topilmadi</h1>
   <p class="muted" style="font-size:14px;line-height:1.7">Siz hali hech qaysi doiraga
    qo'shilmagansiz, yoki ma'lumot yuklanmadi. Internetni tekshirib qayta urinib ko'ring —
    yordam bermasa, doira egasiga ayting.</p>
   ${syncMsg?`<p class="clay small">${esc(syncMsg)}</p>`:""}
   <button class="btn btn-gold btn-wide" style="margin-top:16px" onclick="A.refresh()">Qayta urinish</button>
   <button class="btn btn-wide" style="margin-top:10px" onclick="A.logout()">Chiqish</button>
  </div>`;return}
 const cfg=myCfg();
 let h=`<div class="flex between center mb18">
  <div class="flex center gap3">
   <div class="hd" style="height:36px;background:${colorOf(me)}"></div>
   <div><div class="eyebrow">Ahd daftari</div>
    <div style="font-family:var(--serif);font-size:21px;margin-top:2px">${esc(first(cfg.name))}
     <span class="muted" style="font-size:13px">· ${esc(cfg.city)}</span></div></div>
  </div>
  <div class="flex gap2">
   <button class="btn" title="${online?"Ulangan":"Oflayn"}" onclick="A.refresh()">
     <span class="dot" style="background:${online?"var(--jade)":"var(--clay)"}"></span>↻</button>
   <button class="btn" onclick="A.go('sync')">⚙</button>
  </div></div>
 <div class="ayat mb18"><span class="brass">❝</span><span>${AYAT[new Date(date+"T12:00:00").getDate()%AYAT.length]}</span></div>`;
 h+=circleSwitcher(circles);
 /* Bolada jarima vazifasi yo'q, shuning uchun bo'lim ham yo'q — bo'sh ekranga
    olib boradigan tugma qo'yishdan ko'ra olib turgani ma'qul. */
 /* Vazifa alohida bo'lim emas: ahd shartlari ham, jarima vazifasi ham Sunnat
    sahifasining tagida turadi. Eski telefonda saqlanib qolgan tanlov shu yerga
    olib boriladi, aks holda ekran bo'sh chiqardi. */
 if(tab==="task")tab="sunnat";
 h+= tab==="today"?todayTab():tab==="stats"?statsTab():tab==="sunnat"?sunnatTab():tab==="book"?bookTab():tab==="nishon"?nishonTab():todayTab();
 h+=`<div class="tabbar"><div>
  <button class="${tab==="today"?"on":""}" onclick="A.setTab('today')"><span>📋</span>Bugun</button>
  <button class="${tab==="stats"?"on":""}" onclick="A.setTab('stats')"><span>📊</span>Reyting</button>
  <button class="${tab==="sunnat"?"on":""}" onclick="A.setTab('sunnat')"><span>📖</span>Sunnat</button>
  <button class="${tab==="book"?"on":""}" onclick="A.setTab('book')"><span>📚</span>Kitob</button>
  <button class="${tab==="nishon"?"on":""}" onclick="A.setTab('nishon')"><span>🏅</span>Nishon</button>
 </div></div>`;
 app.innerHTML=h;
 window.scrollTo(0,y)}

A.boot();
</script>
</body>
</html>
