# Install only after the trusted certificate exists.
server {
    listen 80;
    server_name namoz.45.94.209.69.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/namoz-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name namoz.45.94.209.69.sslip.io;
    ssl_certificate /etc/letsencrypt/live/namoz.45.94.209.69.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/namoz.45.94.209.69.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
