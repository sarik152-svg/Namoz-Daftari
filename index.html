<style>
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--sans);
     padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:22px 16px 100px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
button{font:inherit}
.eyebrow{color:var(--brass);font-size:10px;letter-spacing:.22em;text-transform:uppercase}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.p14{padding:14px}.p18{padding:18px}
.mb10{margin-bottom:10px}.mb14{margin-bottom:14px}.mb18{margin-bottom:18px}.mt12{margin-top:12px}.mt14{margin-top:14px}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}
.gap2{gap:8px}.gap3{gap:12px}.col{flex-direction:column}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;
     padding:7px 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px}
.btn:active{opacity:.7}
.btn-gold{background:var(--brass);color:#0D1220;border:none;font-weight:600}
.btn-green{background:var(--jade);color:#08140F;border:none;font-weight:600}
.btn-wide{width:100%;padding:13px 0;border-radius:12px;font-size:14px}
.mbtn{width:42px;height:42px;border-radius:11px;cursor:pointer;background:var(--panel2);
      border:1px solid var(--line);color:var(--mut);display:flex;align-items:center;justify-content:center;font-size:20px}
.input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
      border-radius:9px;padding:10px 11px;font-family:var(--sans);font-size:13px;outline:none}
textarea{line-height:1.6;resize:vertical}
.label{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin:16px 0 7px}
.row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.row span:first-child{color:var(--mut)}
.stat{padding:12px;text-align:center}
.stat b{font-family:var(--serif);font-size:25px;font-weight:400;display:block;line-height:1}
.stat i{font-style:normal;font-size:10px;color:var(--mut);display:block;margin-top:5px}
.bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;display:flex}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(13,18,32,.95);border-top:1px solid var(--line);
        backdrop-filter:blur(8px);padding-bottom:env(safe-area-inset-bottom)}
.tabbar div{max-width:560px;margin:0 auto;display:flex}
.tabbar button{flex:1;padding:11px 0 14px;background:none;border:none;cursor:pointer;color:var(--mut);
        display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;letter-spacing:.05em}
.tabbar button.on{color:var(--brass)}
.ayat{display:flex;gap:8px;padding:10px 12px;background:var(--panel);border-left:2px solid var(--brass);
      border-radius:0 10px 10px 0;font-family:var(--serif);font-size:13.5px;color:var(--mut);line-height:1.55;font-style:italic}
.muted{color:var(--mut)}.small{font-size:11px}.tiny{font-size:10.5px}
.jade{color:var(--jade)}.clay{color:var(--clay)}.brass{color:var(--brass)}
.arc{position:relative;height:6px;border-radius:3px;background:var(--panel2);
     background-image:linear-gradient(90deg,#4CAF8B55,#4CAF8B33 55%,#C9A22744)}
.arc i{position:absolute;top:-3px;width:6px;height:12px;border-radius:2px;background:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.pname{font-family:var(--serif);font-size:17px}
.chip{font-size:9px;border:1px solid #C9A22755;color:var(--brass);border-radius:4px;padding:1px 5px}
.hd{width:6px;border-radius:3px}
.sw{width:22px;height:22px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;padding:0}
.sw.on{background:var(--brass);border-color:var(--brass)}
.link{background:none;border:none;color:var(--brass);font-size:12px;cursor:pointer;padding:8px 0}
</style>
</head>

/* ══════════════ NAMOZ VAQTI ══════════════ */
const D2R=Math.PI/180;
const sinD=d=>Math.sin(d*D2R),cosD=d=>Math.cos(d*D2R),tanD=d=>Math.tan(d*D2R);
const asinD=x=>Math.asin(x)/D2R,acosD=x=>Math.acos(x)/D2R;
const atan2D=(y,x)=>Math.atan2(y,x)/D2R,acotD=x=>Math.atan(1/x)/D2R;
const fixn=(a,b)=>{a-=b*Math.floor(a/b);return a<0?a+b:a};
const fixAng=a=>fixn(a,360),fixHr=a=>fixn(a,24);
function julian(y,m,d){if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
 return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){const D=jd-2451545,g=fixAng(357.529+.98560028*D),q=fixAng(280.459+.98564736*D);
 const L=fixAng(q+1.915*sinD(g)+.02*sinD(2*g)),e=23.439-.00000036*D;
 const RA=fixHr(atan2D(cosD(e)*sinD(L),cosD(L))/15);
 return{decl:asinD(sinD(e)*sinD(L)),eqt:q/15-RA}}
function calcTimes(date,c){
 const jd=julian(date.getFullYear(),date.getMonth()+1,date.getDate())-c.lng/(15*24);
 const midDay=t=>fixHr(12-sunPos(jd+t).eqt);
 const at=(ang,t,ccw)=>{const dc=sunPos(jd+t).decl;
   let x=(-sinD(ang)-sinD(dc)*sinD(c.lat))/(cosD(dc)*cosD(c.lat));x=Math.max(-1,Math.min(1,x));
   return midDay(t)+(ccw?-1:1)*(acosD(x)/15)};
 const asrT=(f,t)=>{const dc=sunPos(jd+t).decl;return at(-acotD(f+tanD(Math.abs(c.lat-dc))),t,false)};
 let t={fajr:5/24,sunrise:6/24,dhuhr:.5,asr:13/24,maghrib:.75,isha:19/24};
 for(let i=0;i<3;i++){t={fajr:at(c.fa,t.fajr,true)/24,sunrise:at(.833,t.sunrise,true)/24,
   dhuhr:(midDay(t.dhuhr)+1/60)/24,asr:asrT(c.asr,t.asr)/24,
   maghrib:at(.833,t.maghrib,false)/24,isha:at(c.ia,t.isha,false)/24}}
 const off=c.tz-c.lng/15,o={};for(const k in t)o[k]=fixHr(t[k]*24+off);return o}
function daySchedule(date,c){
 const T=calcTimes(date,c),pv=new Date(date);pv.setDate(pv.getDate()-1);
 const P=calcTimes(pv,c),nl=24-P.maghrib+T.fajr;
 return{tahajjud:fixHr(P.maghrib+2/3*nl),bomdod:T.fajr,peshin:T.dhuhr,asr:T.asr,shom:T.maghrib,xufton:T.isha,
  endTahajjud:T.fajr,endBomdod:T.sunrise,endPeshin:T.asr,endAsr:T.maghrib,endShom:T.isha,endXufton:T.fajr}}
const hm=d=>{if(d==null||isNaN(d))return"--:--";const m=fixn(Math.round(d*60),1440);
 return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const toMin=s=>{const p=String(s).split(":");return +p[0]*60+ +p[1]};
const diffMin=(a,b)=>{let d=toMin(b)-toMin(a);if(d<-720)d+=1440;if(d>720)d-=1440;return d};
const winLen=(s,e)=>{let d=toMin(e)-toMin(s);if(d<=0)d+=1440;return d};
const inWin=(n,s,e)=>e>s?(n>=s&&n<e):(n>=s||n<e);

{t:"Salomni birinchi berish",d:"Kichik kattaga, yurgan o'tirganga, ozchilik ko'pchilikka salom beradi. Salom — muhabbatning kaliti.",a:"Bugun kamida 5 kishiga birinchi bo'lib salom bering."},
{t:"Har ishni o'ngdan boshlash",d:"Payg'ambarimiz (s.a.v.) poyabzal kiyish, taharat olish, taomlanish va tarashda o'ng tomonni ma'qul ko'rardilar.",a:"Bugun har bir ishni ongli ravishda o'ngdan boshlang."},
{t:"Bismillah bilan boshlash",d:"Taomdan avval «Bismillah», unutilsa «Bismillahi avvalahu va oxirahu» aytiladi. So'ngida «Alhamdulillah».",a:"Har ovqatda ovoz chiqarib ayting — bola-chaqa ham eshitsin."},

{t:"Juma odobi",d:"G'usl, toza kiyim, xushbo'ylik, erta borish va Kahf surasini o'qish.",a:"Yaqin jumaga rejani bugundan yozib qo'ying."},
{t:"Dushanba-payshanba ro'zasi",d:"Amallar shu ikki kunda ko'tariladi, Payg'ambarimiz ro'za tutishni yaxshi ko'rar edilar.",a:"Kelasi payshanbani belgilab qo'ying."},

{t:"Duho namozi",d:"Har bir bo'g'in uchun sadaqa lozim — ikki rakat duho shuning o'rnini bosadi.",a:"Peshingacha 2-4 rakat duho o'qing."},
{t:"Namozdan keyingi tasbeh",d:"33 Subhanalloh, 33 Alhamdulillah, 34 Allohu akbar.",a:"Bugun besh vaqtda ham to'liq bajaring."},

function score(u){
 const days=(u&&u.days)||{},ds=Object.keys(days).sort();
 const o={penalty:0,ontime:0,qazo:0,bad:0,tahajjud:0,quran:0,per:{},bonusSum:0,debt:0,tasks:((u&&u.tasks)||[]).length};
 PRAYERS.forEach(p=>o.per[p.k]={ontime:0,qazo:0,bad:0,delaySum:0,delayN:0});
 ((u&&u.bonuses)||[]).forEach(b=>o.bonusSum+=b.amt);
 if(ds.length){const td=today();let d=ds[0];
  for(let i=0;i<800&&d<=td;i++,d=shift(d,1)){
   const day=days[d]||{},closed=d<td;
   PRAYERS.forEach(p=>{const r=day[p.k];
    if(!p.fard){if(r&&r.s==="ontime"){o.tahajjud++;o.per[p.k].ontime++}return}
    if(!r){if(closed){o.penalty+=P_MISS;o.bad++;o.per[p.k].bad++}return}
    if(r.s==="ontime"){o.ontime++;o.per[p.k].ontime++}
    else if(r.s==="qazo"){o.penalty+=P_QAZO;o.qazo++;o.per[p.k].qazo++}
    else{o.penalty+=P_MISS;o.bad++;o.per[p.k].bad++}});
   if(day.quran)o.quran++}}
 o.debt=o.penalty-o.bonusSum-o.tasks*TASK_AT;
 return o}
function delays(u,c){
 const days=(u&&u.days)||{},per={};PRAYERS.forEach(p=>per[p.k]={sum:0,n:0});
 Object.keys(days).forEach(ds=>{const sc=daySchedule(new Date(ds+"T12:00:00"),c);
  PRAYERS.forEach(p=>{const r=days[ds][p.k];
   if(r&&(r.s==="ontime"||r.s==="qazo")&&r.t){const d=diffMin(hm(sc[p.k]),r.t);
    if(d>=0&&d<900){per[p.k].sum+=d;per[p.k].n++}}})});
 return per}
function streakOf(days,pk){let cur=today(),n=0;
 if(!(days[cur]&&days[cur][pk]&&days[cur][pk].s==="ontime"))cur=shift(cur,-1);
 for(let i=0;i<400;i++){if(days[cur]&&days[cur][pk]&&days[cur][pk].s==="ontime"){n++;cur=shift(cur,-1)}else break}
 return n}
const claimed=(u,pk)=>((u&&u.bonuses)||[]).filter(b=>b.p===pk).reduce((m,b)=>Math.max(m,b.lvl),0);

   <div class="muted small">${Math.floor(mm/60)} soat ${mm%60} daqiqa qoldi</div></div></div>`}
 PRAYERS.forEach(p=>{
  const st0=hm(sc[p.k]),en=hm(sc[EKY[p.k]]),r=day[p.k],S0=r?STATUS[r.s]:null;
  const open=isT&&inWin(nowDec,sc[p.k],sc[EKY[p.k]]);
  const notYet=isT&&!open&&nowDec<sc[p.k];
  const dl=(r&&r.t&&(r.s==="ontime"||r.s==="qazo"))?diffMin(st0,r.t):null;
  h+=`<div class="panel p14 mb10" style="border-color:${S0?S0.color:(open?"#C9A22755":"var(--line)")}">
   <div class="flex center gap3">
    <div style="width:34px;height:34px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;
      justify-content:center;color:${open?"var(--brass)":"var(--mut)"};flex-shrink:0">${p.ic}</div>
    <div style="flex:1;min-width:0">
     <div class="flex center gap2"><span class="pname">${p.n}</span>
      ${!p.fard?'<span class="chip">NAFL</span>':""}
      ${open?'<span class="jade" style="font-size:9px">● VAQTI KIRDI</span>':""}</div>
     <div class="muted small">${st0} — ${en}</div>
    </div>
    <button class="mbtn" style="${["ontime","qazo","late"].includes(r&&r.s)?`background:${r.s==="ontime"?"var(--jade)":"var(--brass)"};border-color:transparent;color:#0D1220`:""}"
      onclick="A.mark('${p.k}','pray')">✓</button>
    <button class="mbtn" style="${(r&&r.s)==="missed"?"background:var(--clay);border-color:transparent;color:#0D1220":""}"
      onclick="A.mark('${p.k}','miss')">−</button>
   </div>`;
  if(r){
   if((r.s==="ontime"||r.s==="qazo")&&r.t){
    const tot=winLen(st0,en),raw=diffMin(st0,r.t)/tot,pos=Math.max(0,Math.min(1,raw));
    h+=`<div class="arc" style="margin-top:12px"><i style="left:calc(${pos*100}% - 3px);background:${raw>1?"var(--clay)":"var(--text)"}"></i></div>`}
   h+=`<div class="flex between center" style="margin-top:8px">
     <div style="font-size:12px;color:${S0.color}">${S0.label} ·
       <span class="${S0.ball===0?"jade":"clay"}">${S0.ball===0?"0 ball":fmt(S0.ball)+" ball"}</span>
       ${dl!=null&&dl>=0&&r.s==="ontime"?" · +"+dl+" daq":""}</div>
     <div class="flex gap2 center">
      ${(r.s==="ontime"||r.s==="qazo")?`<input type="time" value="${r.t||st0}" class="input"
        style="width:auto;padding:4px 7px;font-size:12px" onchange="A.setTime('${p.k}',this.value)">`:""}
      <button class="btn" style="padding:4px 8px;font-size:11px" onclick="A.mark('${p.k}','clear')">tozalash</button>
     </div></div>`;
  }else{
   h+=`<div class="muted" style="margin-top:10px;font-size:11.5px">${
    !p.fard?"Nafl — ball ketmaydi, faqat strike yig'iladi"
    :notYet?"Vaqti kirmagan"
    :open?"Vaqti ichida — hozir belgilasangiz 0 ball"
    :isT?"Vaqti o'tdi — bugun qazo qilsangiz −0,25, ertaga qolsa −1"
    :"Belgilanmagan — o'tkazib yuborilgan hisoblanadi (−1)"}</div>`}
  h+=`</div>`});
 h+=`<div class="panel p14 mt14 flex between center">
   <div><div style="font-family:var(--serif);font-size:16px">Bugun Qur'on o'qidim</div>
   <div class="muted small">Oz bo'lsa ham — davomiysi afzal</div></div>
   <button class="mbtn" style="${day.quran?"background:var(--jade);border-color:transparent;color:#0D1220":""}"
     onclick="A.field('quran',${day.quran?"false":"true"})">✓</button></div>`;
 return h}

/* ────────── STATISTIKA ────────── */
function statsTab(){
 const ranked=members.slice().sort((a,b)=>{
  const sa=score(data[a.id]),sb=score(data[b.id]);
  const pa=sa.ontime+sa.qazo+sa.bad,pb=sb.ontime+sb.qazo+sb.bad;
  return (pb?sb.ontime/pb:0)-(pa?sa.ontime/pa:0)});
 let h=`<div class="eyebrow">Jamoa</div><h2 style="font-size:24px;margin:6px 0 14px">Taqqoslash</h2><div class="grid2 mb14">`;
 ranked.forEach((m,i)=>{
  const s=score(data[m.id]),tot=s.ontime+s.qazo+s.bad,pct=tot?Math.round(s.ontime/tot*100):0;
  h+=`<div class="panel p14" style="border-color:${m.id===me?"#C9A22766":"var(--line)"}">
   <div class="flex center gap2" style="margin-bottom:8px">
    <div class="hd" style="height:26px;background:${colorOf(m.id)}"></div>
    <div><div style="font-family:var(--serif);font-size:16px">${esc(first(m.name))}</div>
    <div class="muted tiny">${esc(m.city)} · ${i+1}-o'rin</div></div></div>
   <div style="font-family:var(--serif);font-size:31px;line-height:1;color:${pct>=80?"var(--jade)":pct>=50?"var(--brass)":"var(--clay)"}">
     ${pct}<span class="muted" style="font-size:14px">%</span></div>
   <div class="muted tiny" style="margin-bottom:9px">vaqtida o'qilgan</div>
   <div class="row"><span>Vaqtida</span><span class="jade">${s.ontime}</span></div>
   <div class="row"><span>Qazo</span><span class="brass">${s.qazo}</span></div>
   <div class="row"><span>O'tkazilgan</span><span class="clay">${s.bad}</span></div>
   <div class="row"><span>Tahajjud</span><span class="brass">${s.tahajjud}</span></div>
   <div class="row" style="border-top:1px solid var(--line);margin-top:6px;padding-top:6px">
     <span>${s.debt>0?"Qarz":"Zaxira"}</span>
     <span class="${s.debt>0?"clay":"jade"}">${s.debt>0?"−"+fmt(s.debt):"+"+fmt(-s.debt)}</span></div>
  </div>`});
 h+=`</div>`;
 /* strike */
 h+=`<div class="panel p14 mb14" style="border-color:#C9A22744"><div class="eyebrow">Strike — har ${STREAK_STEP} kun mukofot</div>
  <p class="muted small" style="margin:6px 0 12px">Bir namozni ${STREAK_STEP} kun ketma-ket vaqtida o'qisangiz,
   qarzingizning yarmi o'chadi (${BONUS_MIN}–${BONUS_MAX} ball).</p>`;
 PRAYERS.forEach(p=>{
  const st=streakOf(data[me].days||{},p.k),lvl=Math.floor(st/STREAK_STEP),cl=claimed(data[me],p.k);
  const ready=lvl>cl,prog=(st%STREAK_STEP)/STREAK_STEP;
  h+=`<div style="margin-bottom:11px">
   <div class="flex between center" style="font-size:12px;margin-bottom:5px">
    <span>${p.n} <span class="muted">· ${st} kun</span></span>
    ${ready?`<button class="btn btn-gold" style="padding:4px 10px;font-size:11px" onclick="A.claim('${p.k}',${lvl})">🎁 Mukofotni olish</button>`
     :`<span class="muted small">${cl>0?cl+" mukofot · ":""}${STREAK_STEP-(st%STREAK_STEP)} kun qoldi</span>`}
   </div>
   <div class="bar"><div style="width:${(ready?1:prog)*100}%;background:${ready?"var(--brass)":"var(--jade)"}"></div></div>
  </div>`});
 h+=`</div>`;
 /* 14 kunlik grafik */
 h+=`<div class="panel p14 mb14"><div class="eyebrow">So'nggi 14 kun · vaqtida o'qilgan farzlar</div>${chartSVG()}</div>`;
 /* namozlar tahlili */
 h+=`<div class="panel p14"><div class="eyebrow">Qaysi namoz og'ir kelmoqda</div><div class="mt12">`;
 PRAYERS.forEach(p=>{
  h+=`<div style="margin-bottom:14px"><div style="font-size:12.5px;margin-bottom:6px">${p.n}</div>`;
  members.forEach(m=>{
   const s=score(data[m.id]).per[p.k],tot=s.ontime+s.qazo+s.bad;
   const d=delays(data[m.id],m)[p.k],avg=d.n?Math.round(d.sum/d.n):null;
   h+=`<div style="margin-bottom:5px">
    <div class="flex between tiny muted" style="margin-bottom:3px">
     <span style="color:${colorOf(m.id)}">${esc(first(m.name))}</span>
     <span>${s.ontime}/${s.qazo}/${s.bad}${avg!=null?" · "+avg+" daq":""}</span></div>
    <div class="bar">
     <div style="width:${tot?s.ontime/tot*100:0}%;background:var(--jade)"></div>
     <div style="width:${tot?s.qazo/tot*100:0}%;background:var(--brass)"></div>
     <div style="width:${tot?s.bad/tot*100:0}%;background:var(--clay)"></div></div></div>`});
  h+=`</div>`});
 h+=`<div class="muted tiny" style="line-height:1.6">Raqamlar: vaqtida / qazo / o'tkazib yuborilgan.
  «daq» — o'rtacha necha daqiqadan keyin o'qilgani.</div></div></div>`;
 return h}

function chartSVG(){
 const W=520,H=150,pad=20,n=14,k=members.length;
 const gw=(W-pad*2)/n,bw=Math.max(3,(gw-4)/Math.max(1,k));
 let bars="",labels="";
 for(let i=0;i<n;i++){
  const ds=shift(today(),-(n-1-i)),x0=pad+i*gw;
  members.forEach((m,j)=>{
   const day=(data[m.id]&&data[m.id].days&&data[m.id].days[ds])||{};
   const v=PRAYERS.filter(p=>p.fard&&day[p.k]&&day[p.k].s==="ontime").length;
   const hh=(H-38)*(v/5),x=x0+2+j*bw;
   bars+=`<rect x="${x.toFixed(1)}" y="${(H-24-hh).toFixed(1)}" width="${(bw-1).toFixed(1)}" height="${Math.max(hh,1).toFixed(1)}"
     rx="2" fill="${colorOf(m.id)}" opacity="${v?1:.25}"></rect>`});
  if(i%2===0)labels+=`<text x="${(x0+gw/2).toFixed(1)}" y="${H-8}" fill="#8895AE" font-size="9" text-anchor="middle">${ds.slice(8)}</text>`}
 let grid="";[0,.5,1].forEach(f=>{const y=H-24-(H-38)*f;
  grid+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#26314A" stroke-dasharray="2 4"></line>`});
 const leg=members.map(m=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px">
   <span class="dot" style="background:${colorOf(m.id)}"></span><span class="muted tiny">${esc(first(m.name))}</span></span>`).join("");
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:10px">${grid}${bars}${labels}</svg>
  <div style="margin-top:6px">${leg}</div>`}

/* ────────── SUNNAT ────────── */
function sunnatTab(){
 const s=sunnatOf(date),day=(data[me].days||{})[date]||{};
 let h=`<div class="eyebrow">Kunning sunnati · ${pretty(date)}</div>
 <div class="panel p18 mb14" style="margin-top:10px;border-color:#C9A22744">
  <div class="brass" style="font-family:var(--serif);font-size:23px;line-height:1.25">${esc(s.t)}</div>
  <p style="font-size:14px;line-height:1.65;margin:10px 0 0">${esc(s.d)}</p>
  <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
   <div class="eyebrow">Bugungi mashq</div>
   <p class="muted" style="font-size:13px;margin:5px 0 0">${esc(s.a)}</p></div></div>
 <div class="panel p14 mb14"><div class="eyebrow">Daftaringiz</div>
  <p class="muted" style="font-size:12px;margin:6px 0 8px">Bugun bu sunnatdan nimani o'rgandingiz va qanday amal qildingiz?</p>
  <textarea rows="5" placeholder="Masalan: bugun 5 kishiga birinchi salom berdim…"
    onblur="A.note(this.value)">${esc(day.sunnat||"")}</textarea></div>`;
 members.filter(m=>m.id!==me).forEach(m=>{
  const note=((data[m.id]&&data[m.id].days&&data[m.id].days[date])||{}).sunnat;
  h+=`<div class="panel p14 mb10">
   <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:${colorOf(m.id)}">${esc(first(m.name))} yozgani</div>
   <p style="font-size:13px;line-height:1.65;margin:8px 0 0;white-space:pre-wrap;color:${note?"var(--text)":"var(--mut)"}">${esc(note||"Hali yozilmagan.")}</p></div>`});
 return h}

/* ────────── VAZIFA ────────── */
function taskTab(){
 const s=score(data[me]),pending=Math.max(0,Math.floor(s.debt/TASK_AT));
 let h=`<div class="eyebrow">Ahd shartlari</div><h2 style="font-size:24px;margin:6px 0 12px">Ball va vazifa</h2>
 <div class="panel p14 mb14"><div class="muted" style="font-size:12px;line-height:1.75">
  <div><span class="jade">Vaqtida o'qilsa</span> — 0 ball</div>
  <div><span class="brass">Vaqti o'tib, o'sha kun ichida qazo qilinsa</span> — −0,25</div>
  <div><span class="clay">Kun yopilib, keyingi kunga qolsa yoki o'qilmasa</span> — −1</div>
  <div><span class="brass">Har ${STREAK_STEP} kunlik strike</span> — qarzning yarmi o'chadi</div>
  <div><span style="color:var(--text)">Har ${TASK_AT} ball qarz</span> — 25 rakat nafl va 500 tasbeh</div>
 </div></div>
 <div class="grid3 mb14">
  <div class="panel stat"><b class="clay">${fmt(s.penalty)}</b><i>Jamg'arilgan minus</i></div>
  <div class="panel stat"><b class="jade">−${fmt(s.bonusSum+s.tasks*TASK_AT)}</b><i>Mukofot + vazifa</i></div>
  <div class="panel stat"><b class="${s.debt>0?"brass":"jade"}">${s.debt>0?fmt(s.debt):"+"+fmt(-s.debt)}</b><i>${s.debt>0?"Qolgan qarz":"Zaxira"}</i></div>
 </div>`;
 if(pending>0){
  let sw="";for(let i=0;i<25;i++)sw+=`<button class="sw ${i<A.rak?"on":""}" onclick="A.setRak(${i+1})"></button>`;
  h+=`<div class="panel p18" style="border-color:#C9A22766">
   <div class="brass" style="font-family:var(--serif);font-size:20px">Faol vazifa</div>
   <p class="muted" style="font-size:12px;margin:4px 0 16px">Qarz ${fmt(s.debt)} ball. ${pending} ta vazifa ochiq — har biri 4 ballni yopadi.</p>
   <div style="margin-bottom:18px">
    <div class="flex between" style="font-size:12px;margin-bottom:8px"><span>Nafl namoz</span><span class="brass">${A.rak} / 25 rakat</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:4px">${sw}</div></div>
   <div class="flex between" style="font-size:12px;margin-bottom:8px"><span>Tasbeh</span><span class="brass">${A.tas} / 500</span></div>
   <div class="bar" style="height:6px;margin-bottom:12px"><div style="width:${Math.min(100,A.tas/5)}%;background:var(--brass)"></div></div>
   <div class="flex gap2">
    <button onclick="A.addTas(1)" style="flex:1;padding:16px 0;border-radius:12px;background:var(--panel2);
      border:1px solid #C9A22755;color:var(--brass);font-family:var(--serif);font-size:18px;cursor:pointer">Subhanalloh +1</button>
    <button class="btn" style="padding:16px 14px" onclick="A.addTas(33)">+33</button>
    <button class="btn" style="padding:16px 14px" onclick="A.resetTas()">↺</button></div>
   <button class="btn-wide ${A.rak>=25&&A.tas>=500?"btn-green":"btn"}" style="margin-top:18px;border:none;
     ${A.rak>=25&&A.tas>=500?"":"background:var(--panel2);color:var(--mut)"}"
     ${A.rak>=25&&A.tas>=500?'onclick="A.finishTask()"':""}>Vazifani yopish (−4 ball)</button>
  </div>`;
 }else{
  h+=`<div class="panel" style="padding:26px;text-align:center">
   <div style="font-size:26px">🏅</div>
   <div style="font-family:var(--serif);font-size:19px;margin-top:6px">Vazifa yo'q</div>
   <p class="muted" style="font-size:13px;margin-top:6px">${s.debt>0?"Yana "+fmt(TASK_AT-s.debt)+" ball qarz yig'ilsa vazifa ochiladi.":"Qarzingiz yo'q. Strike'ni uzmang."}</p></div>`}
 h+=`<div class="panel p14 mt14"><div class="eyebrow">Jamoa holati</div><div class="mt12">`;
 members.filter(m=>m.id!==me).forEach(m=>{const o=score(data[m.id]);
  h+=`<div style="padding:7px 0;border-bottom:1px solid var(--line)">
   <div style="font-size:12.5px;color:${colorOf(m.id)};margin-bottom:3px">${esc(first(m.name))}</div>
   <div class="row"><span>Minus / mukofot / vazifa</span><span class="muted">${fmt(o.penalty)} · −${fmt(o.bonusSum)} · ${o.tasks}</span></div>
   <div class="row"><span>${o.debt>0?"Qarz":"Zaxira"}</span><span class="${o.debt>0?"clay":"jade"}">${o.debt>0?"−"+fmt(o.debt):"+"+fmt(-o.debt)}</span></div></div>`});
 h+=`</div></div>`;
 const bs=(data[me].bonuses)||[];
 if(bs.length){h+=`<div class="panel p14 mt14"><div class="eyebrow">Mukofot tarixi</div><div class="mt12">`;
  bs.slice().reverse().forEach(b=>{const p=PRAYERS.find(x=>x.k===b.p);
   h+=`<div class="row"><span>${p?p.n:b.p} · ${b.lvl*STREAK_STEP} kun · ${b.d}</span><span class="jade">−${fmt(b.amt)}</span></div>`});
  h+=`</div></div>`}
 return h}

/* ────────── RENDER ────────── */
function render(){
 const app=document.getElementById("app");
 const y=window.scrollY;
 if(!me||screen==="pick"){app.innerHTML=pickScreen();return}
 if(screen==="add"){app.innerHTML=addScreen();return}
 if(screen==="sync"){app.innerHTML=syncScreen();return}
 const cfg=M(me);
 let h=`<div class="flex between center mb18">
  <div class="flex center gap3">
   <div class="hd" style="height:36px;background:${colorOf(me)}"></div>
   <div><div class="eyebrow">Ahd daftari</div>
    <div style="font-family:var(--serif);font-size:21px;margin-top:2px">${esc(first(cfg.name))}
     <span class="muted" style="font-size:13px">· ${esc(cfg.city)}</span></div></div>
  </div>
  <div class="flex gap2">
   <button class="btn" title="${syncOn()?(online?"Ulangan":"Oflayn"):"Sinxron o'chiq"}" onclick="A.refresh()">
     <span class="dot" style="background:${syncOn()?(online?"var(--jade)":"var(--clay)"):"var(--mut)"}"></span>↻</button>
   <button class="btn" onclick="A.go('pick')">👥</button>
  </div></div>
 <div class="ayat mb18"><span class="brass">❝</span><span>${AYAT[new Date(date+"T12:00:00").getDate()%AYAT.length]}</span></div>`;
 h+= tab==="today"?todayTab():tab==="stats"?statsTab():tab==="sunnat"?sunnatTab():taskTab();
 h+=`<div class="tabbar"><div>
  <button class="${tab==="today"?"on":""}" onclick="A.setTab('today')"><span>📋</span>Bugun</button>
  <button class="${tab==="stats"?"on":""}" onclick="A.setTab('stats')"><span>📊</span>Statistika</button>
  <button class="${tab==="sunnat"?"on":""}" onclick="A.setTab('sunnat')"><span>📖</span>Sunnat</button>
  <button class="${tab==="task"?"on":""}" onclick="A.setTab('task')"><span>🔥</span>Vazifa</button>
 </div></div>`;
 app.innerHTML=h;
 window.scrollTo(0,y)}

A.boot();
</script>
</body>
</html>
