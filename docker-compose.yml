# Namoz Daftari on Sardor's own server, beside his other projects.
#
# The database keeps its own named volume and is published only on localhost, so a
# dump or a psql session is one command away on the box and nothing is reachable
# from outside. The app is published on the IP because that is where the circle
# will find it.
services:
  db:
    image: postgres:16-alpine
    container_name: namoz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: namoz
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: namoz
    volumes:
      - namoz_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namoz -d namoz"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: namoz-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://namoz:${DB_PASSWORD}@db:5432/namoz
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PIN_ENCRYPTION_KEY: ${PIN_ENCRYPTION_KEY}
      SEED_MEMBERS: ""
      PORT: "8080"
    ports:
      - "8095:8080"

volumes:
  namoz_pgdata:
